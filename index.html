  * { box-sizing: border-box; }

  /* Subtle themed scrollbars */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.62;
    letter-spacing: -0.011em;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .shell {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    transition: filter 0.28s ease, opacity 0.28s ease;
  }

  body.away-blur .shell {
    filter: blur(6px);
    opacity: 0.78;
    user-select: none;
  }

  #oneko {
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center center;
  }

  body.away-blur #oneko {
    transform: scale(2.8);
    z-index: 2147483647 !important;
  }

  /* ===== Sidebar ===== */
  aside.sidebar {
    position: relative;
    z-index: 6;
    width: 272px;
    flex: 0 0 272px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: margin-left 0.2s ease;
  }

  aside.sidebar.collapsed {
    margin-left: -272px;
  }

  .sidebar-header {
    height: 44px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px solid var(--accent);
    border-bottom: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--sidebar-bg));
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 650;
    font-size: 15.5px;
    letter-spacing: -0.02em;
  }

  .brand-mark {
    width: 25px;
    height: 25px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13.5px;
  }

  .sidebar-actions {
    padding: 10px 12px 6px;
    display: flex;
    gap: 6px;
  }

  .add-project-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s, border-color 0.15s;
  }

  .add-project-btn:hover {
    background: var(--surface-subtle);
    border-color: var(--accent);
  }

  .sidebar-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar-section-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    padding: 4px 8px 2px;
  }

  .repo-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .repo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 8px;
  }

  .repo-name {
    font-size: 12.5px;
    font-weight: 650;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .repo-btns {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0.75;
  }

  .repo-header:hover .repo-btns {
    opacity: 1;
  }

  .tiny-btn {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    padding: 0;
  }

  .tiny-btn:hover {
    background: var(--surface);
    color: var(--text);
  }

  .tiny-btn.danger:hover {
    color: var(--danger);
  }

  .wt-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text);
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }

  .wt-item:hover {
    background: var(--surface-subtle);
  }

  .wt-item.active {
    background: var(--surface);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
    font-weight: 550;
  }

  .wt-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    opacity: 0.45;
    flex-shrink: 0;
  }

  .wt-dot.running {
    background: var(--success);
    opacity: 1;
  }

  .wt-dot.busy {
    background: var(--accent);
    opacity: 1;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .wt-label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wt-tag {
    font-size: 10.5px;
    color: var(--text-faint);
    background: var(--surface-subtle);
    padding: 1px 6px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .wt-remove {
    opacity: 0;
    transition: opacity 0.12s;
  }

  .wt-item:hover .wt-remove {
    opacity: 1;
  }

  .sidebar-empty {
    padding: 18px 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.82); }
  }

  /* ===== Main Workspace ===== */
  .main-pane {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header.topbar {
    flex: 0 0 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 12px;
    border-top: 2px solid var(--accent);
    border-bottom: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--sidebar-bg));
    box-shadow: none;
    z-index: 10;
    min-width: 0;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .active-crumb {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border-radius: 5px;
    background: var(--bg);
    border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border-strong));
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
    max-width: 240px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .active-crumb .branch-sub {
    color: var(--accent);
    font-weight: 600;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    max-width: 100%;
  }

  select.pill-select,
  button.pill-btn {
    appearance: none;
    height: 28px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--border-strong));
    border-radius: 5px;
    padding: 0 9px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: none;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    outline: none;
  }

  select.pill-select:hover,
  button.pill-btn:hover {
    background-color: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  select.pill-select {
    max-width: 155px;
    padding-right: 22px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                      linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
    background-size: 4.5px 4.5px, 4.5px 4.5px;
    background-repeat: no-repeat;
    text-overflow: ellipsis;
  }

  select.pill-select:hover,
  button.pill-btn:hover {
    background-color: var(--surface-subtle);
    border-color: var(--border-strong);
  }

  button.icon-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  button.icon-btn:hover {
    background: var(--surface-subtle);
    color: var(--text);
  }

  /* Transcript */
  main#scrollContainer {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 20px 44px;
    position: relative;
    background-color: var(--bg);
    overscroll-behavior: contain;
  }

  .thread {
    position: relative;
    z-index: 2;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ===== Per-Theme Animated Background Stage (Pure CSS GPU, ~0 RAM) ===== */
  .bg-stage {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
    contain: strict;
  }

  .main-pane {
    position: relative;
    z-index: 1;
  }

  header.topbar, footer {
    position: relative;
    z-index: 5;
  }

  .bg-glow {
    position: absolute;
    border-radius: 50%;
    opacity: 0.72;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    animation: glowPulse 9s ease-in-out infinite alternate;
  }

  @keyframes glowPulse {
    0% { opacity: 0.45; transform: scale(0.96); }
    100% { opacity: 0.85; transform: scale(1.06); }
  }

  .bg-glow.g1 {
    width: 480px; height: 480px;
    top: -110px; left: 14%;
  }

  .bg-glow.g2 {
    width: 440px; height: 440px;
    bottom: 10px; right: 5%;
    animation-delay: -4.5s;
  }

  .bg-item {
    position: absolute;
    color: var(--accent);
    opacity: 0.24;
  }

  /* Gentle readability veil behind the central chat column while letting side animations shine */
  .bg-stage::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(780px, 86%);
    background: linear-gradient(90deg, transparent 0%, var(--bg) 12%, var(--bg) 88%, transparent 100%);
    opacity: 0.42;
  }

  /* Motion presets per theme */
  .anim-fall {
    top: -40px;
    animation: bgFall var(--dur, 14s) linear var(--delay, 0s) infinite;
  }
  @keyframes bgFall {
    0% { transform: translate3d(0, -40px, 0) rotate(0deg); opacity: 0; }
    12% { opacity: var(--op, 0.28); }
    88% { opacity: var(--op, 0.28); }
    100% { transform: translate3d(var(--drift, 70px), 108vh, 0) rotate(var(--rot, 240deg)); opacity: 0; }
  }

  .anim-rise {
    bottom: -40px;
    animation: bgRise var(--dur, 16s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes bgRise {
    0% { transform: translate3d(0, 40px, 0) scale(0.85) rotate(0deg); opacity: 0; }
    15% { opacity: var(--op, 0.24); }
    85% { opacity: var(--op, 0.24); }
    100% { transform: translate3d(var(--drift, 35px), -106vh, 0) scale(1.1) rotate(var(--rot, 30deg)); opacity: 0; }
  }

  .anim-twinkle {
    animation: bgTwinkle var(--dur, 4.5s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes bgTwinkle {
    0%, 100% { transform: scale(0.75) rotate(0deg); opacity: 0.08; }
    50% { transform: scale(1.22) rotate(18deg); opacity: var(--op, 0.36); }
  }

  .anim-float {
    animation: bgFloat var(--dur, 11s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  @keyframes bgFloat {
    0% { transform: translate3d(0, 0, 0) rotate(-8deg); opacity: calc(var(--op, 0.22) * 0.75); }
    100% { transform: translate3d(var(--drift, 28px), -26px, 0) rotate(12deg); opacity: var(--op, 0.22); }
  }

  /* Theme-specific subtle ambient glow */
  [data-theme="sakura-neko"] .bg-glow.g1 { background: radial-gradient(circle, rgba(236, 114, 156, 0.22) 0%, transparent 70%); }
  [data-theme="black-cat-midnight"] .bg-glow.g1 { background: radial-gradient(circle, rgba(242, 177, 56, 0.18) 0%, transparent 70%); }
  [data-theme="russian-blue"] .bg-glow.g1 { background: radial-gradient(circle, rgba(78, 201, 148, 0.18) 0%, transparent 70%); }
  [data-theme="ginger-tabby"] .bg-glow.g1 { background: radial-gradient(circle, rgba(212, 98, 42, 0.19) 0%, transparent 70%); }
  [data-theme="siamese-cream"] .bg-glow.g1 { background: radial-gradient(circle, rgba(59, 110, 165, 0.18) 0%, transparent 70%); }

  @media (prefers-reduced-motion: reduce) {
    .bg-glow, .bg-item { animation: none !important; }
  }

  /* ===== Cute Animated Cats (Pure CSS GPU-composited, ~0 RAM) ===== */
  .sidebar-kitty {
    padding: 8px 14px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-faint);
    user-select: none;
  }

  .sleeping-kitty-svg {
    width: 58px;
    height: 30px;
    overflow: visible;
  }

  .kitty-breathe {
    transform-origin: 30px 24px;
    animation: kittyBreathe 3.8s ease-in-out infinite;
  }

  @keyframes kittyBreathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.06); }
  }

  .kitty-zzz {
    font-size: 8px;
    font-weight: 700;
    fill: var(--accent);
    animation: floatZzz 2.8s ease-in-out infinite;
  }
  .kitty-zzz.z2 { animation-delay: 0.9s; }

  @keyframes floatZzz {
    0% { opacity: 0; transform: translate(0, 2px) scale(0.8); }
    40% { opacity: 0.9; }
    100% { opacity: 0; transform: translate(6px, -10px) scale(1.1); }
  }

  /* Perched Composer Cat */
  .composer-wrap {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
  }

  .perched-cat-wrap {
    position: absolute;
    right: 26px;
    top: -33px;
    width: 68px;
    height: 38px;
    cursor: pointer;
    z-index: 3;
    user-select: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .perched-cat-wrap:hover {
    transform: translateY(-3px);
  }

  .perched-cat-wrap.hop {
    animation: catHop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes catHop {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-9px) scale(1.05); }
  }

  .perched-cat-bubble {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    box-shadow: var(--shadow-sm);
    transition: opacity 0.2s, transform 0.25s;
  }

  .perched-cat-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .cat-eye {
    transform-origin: center;
    transform-box: fill-box;
    animation: catBlink 4.6s ease-in-out infinite;
  }

  @keyframes catBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  .cat-ear-r {
    transform-origin: 45px 15px;
    animation: earTwitch 6.5s ease-in-out infinite;
  }

  @keyframes earTwitch {
    0%, 88%, 94%, 100% { transform: rotate(0deg); }
    91% { transform: rotate(10deg); }
  }

  .cat-tail {
    transform-origin: 54px 31px;
    animation: tailSway 2.8s ease-in-out infinite;
  }

  .perched-cat-wrap.working .cat-tail {
    animation-duration: 0.9s;
  }

  @keyframes tailSway {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(14deg); }
  }

  /* Hero Kitty in Empty State */
  .hero-kitty {
    width: 84px;
    height: 74px;
    margin-bottom: -4px;
  }

  /* Cat-ear Send Button */
  .send-btn {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  }

  .send-btn::before,
  .send-btn::after {
    content: "";
    position: absolute;
    top: -4px;
    width: 10px;
    height: 10px;
    background: inherit;
    border-radius: 3px 8px 2px 2px;
    z-index: -1;
    transition: transform 0.16s;
  }

  .send-btn::before {
    left: 3px;
    transform: rotate(-18deg);
  }

  .send-btn::after {
    right: 3px;
    border-radius: 8px 3px 2px 2px;
    transform: rotate(18deg);
  }

  .send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px) scale(1.06);
  }

  .send-btn:active:not(:disabled) {
    transform: scale(0.94);
  }

  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .send-btn.stop { background: var(--text); color: var(--bg); }

  /* Paw streaming indicator */
  .streaming-dots { display: inline-flex; gap: 6px; align-items: center; padding: 6px 2px; color: var(--accent); font-size: 13px; }
  .streaming-dots span {
    display: inline-block;
    animation: pawWalk 1.1s infinite ease-in-out;
  }
  .streaming-dots span:nth-child(2) { animation-delay: 0.18s; }
  .streaming-dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes pawWalk {
    0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.35; }
    40% { transform: translateY(-4px) scale(1.1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .kitty-breathe, .kitty-zzz, .cat-eye, .cat-ear-r, .cat-tail, .streaming-dots span {
      animation: none !important;
    }
  }

  /* Duplicate .thread rule removed (defined above with z-index) */

  .empty-state {
    max-width: 560px;
    margin: 9vh auto 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .empty-state h1 {
    margin: 0;
    font-family: var(--font-heading);
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.22;
  }

  .empty-state p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-muted);
    max-width: 430px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }

  .suggestion-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font-sans);
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, border-color 0.15s, background 0.15s;
  }

  .suggestion-chip:hover {
    border-color: var(--border-strong);
    background: var(--surface-subtle);
    transform: translateY(-1px);
  }

  /* Messages */
  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.14s ease;
    padding: 0 2px;
  }

  .msg-row:hover .msg-actions,
  .msg-actions:focus-within {
    opacity: 1;
  }

  .msg-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-family: var(--font-sans);
    font-size: 11.5px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }

  .msg-action-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* Floating Scroll-to-bottom button */
  .scroll-bottom-btn {
    position: absolute;
    left: 50%;
    top: -42px;
    transform: translateX(-50%) translateY(6px);
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-md);
    border-radius: 999px;
    padding: 5px 13px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 6;
  }

  .scroll-bottom-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .scroll-bottom-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Table horizontal scroll wrapper */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    margin: 14px 0;
  }
  .table-wrap table { margin: 0; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { align-items: flex-end; }
  .msg-row.assistant { align-items: flex-start; }

  .user-bubble {
    max-width: 82%;
    background: var(--user-bubble);
    color: var(--text);
    padding: 10px 15px;
    border-radius: 16px 16px 4px 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
    line-height: 1.55;
    letter-spacing: -0.01em;
  }

  .user-images {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .user-images img {
    max-width: 220px;
    max-height: 180px;
    border-radius: 12px;
    border: 1px solid var(--border);
    object-fit: cover;
  }

  .assistant-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Markdown prose — Codex / Cursor / Orca editorial hierarchy */
  .prose {
    font-family: var(--font-prose);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    letter-spacing: -0.008em;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  [data-font="editorial"] .prose {
    font-size: 16.5px;
    line-height: 1.72;
    letter-spacing: 0;
  }

  .prose > *:first-child { margin-top: 0; }
  .prose > *:last-child { margin-bottom: 0; }
  .prose p { margin: 0 0 12px; }
  .prose h1, .prose h2, .prose h3, .prose h4 {
    font-family: var(--font-heading);
    margin: 22px 0 9px;
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 1.28;
    color: var(--text);
  }
  .prose h1 { font-size: 1.48em; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .prose h2 { font-size: 1.26em; }
  .prose h3 { font-size: 1.08em; color: var(--accent); }
  .prose h4 { font-size: 0.9em; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .prose strong { font-weight: 600; }
  .prose ul, .prose ol { margin: 0 0 11px; padding-left: 20px; }
  .prose li { margin: 3.5px 0; }
  .prose li::marker { color: var(--text-faint); }
  .prose blockquote {
    margin: 12px 0;
    padding: 6px 14px;
    border-left: 2.5px solid var(--accent);
    color: var(--text-muted);
    background: var(--surface-subtle);
    border-radius: 0 8px 8px 0;
    font-size: 13.8px;
  }
  .prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  .prose a:hover { border-bottom-color: var(--accent); }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .prose code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--code-bg);
    padding: 1.5px 5.5px;
    border-radius: 5px;
    border: 1px solid var(--border);
    letter-spacing: 0;
  }

  .code-block {
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    overflow: hidden;
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 12px;
    background: var(--code-header);
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .code-copy-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .code-copy-btn:hover { background: var(--surface); color: var(--text); }
  .code-block pre {
    margin: 0;
    padding: 11px 14px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 12.6px;
    line-height: 1.56;
    letter-spacing: 0;
  }
  .code-block pre code { background: none; border: none; padding: 0; font-size: inherit; }
  .tok-kw { color: var(--syn-kw); font-weight: 500; }
  .tok-str { color: var(--syn-str); }
  .tok-num { color: var(--syn-num); }
  .tok-com { color: var(--syn-com); font-style: italic; }
  .tok-fn { color: var(--syn-fn); }

  .tool-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1.5px 6px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    flex-shrink: 0;
  }

  .prose table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  .prose th { background: var(--surface-subtle); font-weight: 600; }

  /* Disclosures */
  details.disclosure {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    overflow: hidden;
    font-size: 13.5px;
  }
  details.disclosure > summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    color: var(--text-muted);
  }
  details.disclosure > summary::-webkit-details-marker { display: none; }
  details.disclosure > summary:hover { background: var(--surface-subtle); }
  .chevron { display: inline-block; transition: transform 0.15s ease; font-size: 11px; color: var(--text-faint); }
  details.disclosure[open] > summary .chevron { transform: rotate(90deg); }
  .disclosure-title { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .disclosure-meta { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }
  .disclosure-body {
    padding: 10px 14px 12px;
    border-top: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.55;
    max-height: 360px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .disclosure-body.mono { font-family: var(--font-mono); font-size: 12.2px; }
  .tool-section-label {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin: 8px 0 4px;
  }
  .tool-section-label:first-child { margin-top: 0; }

  .spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-ok { color: var(--success); font-size: 13px; flex-shrink: 0; }
  .tool-err { color: var(--danger); font-size: 13px; flex-shrink: 0; }

  .streaming-dots { display: inline-flex; gap: 4px; align-items: center; padding: 6px 2px; }
  .streaming-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .streaming-dots span:nth-child(2) { animation-delay: 0.16s; }
  .streaming-dots span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.75); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .error-note {
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(196, 61, 61, 0.1);
    border: 1px solid rgba(196, 61, 61, 0.25);
    color: var(--danger);
    font-size: 14px;
  }

  /* Footer */
  footer {
    flex: 0 0 auto;
    padding: 20px 20px 18px;
    background: linear-gradient(to top, var(--bg) 82%, transparent);
  }
  .composer {
    position: relative;
    z-index: 4;
    background: var(--surface);
    border: 1.5px solid color-mix(in srgb, var(--accent) 35%, var(--border-strong));
    border-radius: 12px;
    padding: 9px 11px 9px 14px;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.14s, box-shadow 0.14s;
  }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
  }
  .composer.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; }
  .attachments:empty { display: none; }
  .att-chip { position: relative; width: 58px; height: 58px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .att-chip img { width: 100%; height: 100%; object-fit: cover; }
  .att-remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.65); color: #fff;
    font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .composer-row { display: flex; align-items: flex-end; gap: 8px; }
  textarea#promptInput {
    flex: 1 1 auto; border: none; outline: none; resize: none; background: transparent;
    color: var(--text); font-family: var(--font-sans); font-size: 14.5px; line-height: 1.5;
    letter-spacing: -0.01em; max-height: 200px; padding: 4px 0;
  }
  textarea#promptInput::placeholder { color: var(--text-faint); }
  .composer-hint { margin-top: 7px; text-align: center; font-size: 12px; color: var(--text-faint); }

  /* Toasts */
  .toasts {
    position: fixed; right: 20px; bottom: 92px;
    display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: 340px;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-md); border-radius: 12px; padding: 10px 14px;
    font-size: 13.5px; color: var(--text); animation: fadeIn 0.18s ease-out;
  }
  .toast.warning { border-left: 3px solid #d97706; }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%; max-width: 460px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 18px; padding: 20px 22px;
    box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 14px;
  }
  .modal h3 { margin: 0; font-size: 17px; font-weight: 650; }
  .modal p { margin: 0; font-size: 14px; color: var(--text-muted); white-space: pre-wrap; }
  .modal label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .modal-input, .modal-textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 10px 12px; font-family: var(--font-sans); font-size: 14.5px; outline: none;
  }
  .modal-input:focus, .modal-textarea:focus { border-color: var(--accent); }
  .modal-textarea { min-height: 120px; resize: vertical; }
  .modal-options { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .modal-option {
    text-align: left; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-family: var(--font-sans); font-size: 14px; cursor: pointer;
  }
  .modal-option:hover { border-color: var(--accent); background: var(--accent-soft); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 8px 16px; font-family: var(--font-sans); font-size: 14px; font-weight: 550; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface-subtle); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; font-family: var(--font-sans); font-size: 14px; cursor: pointer;
  }

  /* ===== Right Resource Monitor Panel ===== */
  aside.resource-panel {
    position: relative;
    z-index: 6;
    width: 264px;
    flex: 0 0 264px;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: margin-right 0.2s ease;
  }

  aside.resource-panel.collapsed {
    margin-right: -264px;
  }

  .res-header {
    height: 44px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px solid var(--accent);
    border-bottom: 1px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--sidebar-bg));
    font-size: 12.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }

  .res-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .res-card {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 10px 11px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: none;
  }

  .res-card-title {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .res-big {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.15;
  }

  .res-big small {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .res-metric {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .res-metric-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .res-metric-row strong {
    color: var(--text);
    font-weight: 600;
  }

  .res-bar {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-subtle);
    overflow: hidden;
  }

  .res-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.35s ease;
  }

  .res-bar-fill.warn { background: #d97706; }
  .res-bar-fill.high { background: var(--danger); }

  .res-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .res-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 12.5px;
  }

  .res-item-name {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .res-item-val {
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    font-size: 12px;
  }

  .res-pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 768px) {
    aside.sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; box-shadow: var(--shadow-lg); }
    aside.resource-panel { position: fixed; top: 0; bottom: 0; right: 0; z-index: 40; box-shadow: var(--shadow-lg); }
    select.pill-select { max-width: 135px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-mark">🐱</span>
        <span>Meow-Don</span>
      </div>
      <button class="icon-btn" id="refreshWsBtn" title="Refresh worktrees" style="width:28px;height:28px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <div class="sidebar-actions">
      <button class="add-project-btn" id="pickFolderBtn" title="Open repository or folder">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Open repository
      </button>
      <button class="tiny-btn" id="addPathBtn" title="Add repository by path" style="width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:10px;">
        /
      </button>
    </div>

    <div class="sidebar-scroll" id="sidebarList"></div>

    <div class="sidebar-kitty">
      <svg class="sleeping-kitty-svg" viewBox="0 0 64 32" aria-hidden="true">
        <g class="kitty-breathe">
          <!-- Curled body -->
          <ellipse cx="32" cy="23" rx="19" ry="8.5" fill="var(--accent)" opacity="0.88"/>
          <!-- Head -->
          <circle cx="19" cy="20" r="8" fill="var(--accent)"/>
          <!-- Ears -->
          <polygon points="12,15 14,8 19,13" fill="var(--accent)"/>
          <polygon points="20,13 24,8 26,15" fill="var(--accent)"/>
          <!-- Sleeping eyes -->
          <path d="M14.5 20.5 q2 1.8 4 0" stroke="var(--bg)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M20.5 20.5 q2 1.8 4 0" stroke="var(--bg)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- Curled tail -->
          <path d="M49 23 q8 -1 7 -7 q-1 -4 -6 -3" stroke="var(--accent)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        </g>
        <text class="kitty-zzz" x="27" y="10">z</text>
        <text class="kitty-zzz z2" x="34" y="6">Z</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
        <button class="tiny-btn" id="onekoToggle" title="Toggle roaming pixel cat" style="width:auto;padding:2px 8px;font-size:11.5px;border:1px solid var(--border);background:var(--surface);">🐾 Roaming cat: On</button>
        <button class="tiny-btn" id="awayBlurToggle" title="Blur screen & enlarge cat when mouse leaves tab" style="width:auto;padding:2px 8px;font-size:11px;border:1px solid var(--border);background:var(--surface);">👁 Away blur: On</button>
      </div>
    </div>
  </aside>

  <!-- Main Chat Pane -->
  <div class="main-pane">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <div class="active-crumb" id="activeCrumb" title="">
          <span class="wt-dot" id="activeDot"></span>
          <span id="activeTitle">Quick Chat</span>
          <span class="branch-sub" id="activeBranch"></span>
        </div>
      </div>

      <div class="topbar-right">
        <select class="pill-select" id="modelSelect" title="Model"></select>
        <select class="pill-select" id="thinkingSelect" title="Thinking level" style="display:none"></select>
        <select class="pill-select" id="themeSelect" title="Cat theme">
          <option value="catppuccin-mocha">🐱 Catppuccin Mocha</option>
          <option value="catppuccin-macchiato">🐱 Catppuccin Macchiato</option>
          <option value="catppuccin-frappe">🐱 Catppuccin Frappé</option>
          <option value="catppuccin-latte">🐱 Catppuccin Latte</option>
          <option value="ginger-tabby">🧡 Ginger Tabby</option>
          <option value="siamese-cream">💙 Siamese Cream</option>
          <option value="sakura-neko">🌸 Sakura Neko</option>
          <option value="russian-blue">💎 Russian Blue</option>
          <option value="tuxedo-cat">🎩 Tuxedo Cat</option>
          <option value="black-cat-midnight">🌙 Black Cat Midnight</option>
        </select>
        <button class="pill-btn" id="rewindBtn" title="Rewind / fork from an earlier message (Esc twice)">↺ Rewind</button>
        <button class="pill-btn" id="newChatBtn" title="Start a fresh conversation in this worktree">New chat</button>
        <button class="pill-btn res-pill-badge" id="resourceToggle" title="Toggle resource monitor">
          <span>⚡</span><span id="ramBadge">-- MB</span>
        </button>
      </div>
    </header>

    <main id="scrollContainer">
      <div class="bg-stage" id="bgStage" aria-hidden="true"></div>
      <div class="thread" id="thread"></div>
    </main>

    <footer>
      <div class="composer-wrap">
        <button class="scroll-bottom-btn" id="scrollBottomBtn" type="button">↓ Jump to latest</button>
        <div class="perched-cat-wrap" id="perchedCat" title="Pet the kitty">
          <div class="perched-cat-bubble" id="catBubble">purr ♡</div>
          <svg viewBox="0 0 72 40" width="68" height="38" aria-hidden="true">
            <!-- Swaying tail -->
            <path class="cat-tail" d="M54 32 Q66 28 65 16 Q64 10 59 12" stroke="var(--accent)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
            <!-- Body peeking over composer -->
            <ellipse cx="34" cy="34" rx="20" ry="12" fill="var(--accent)"/>
            <!-- Head -->
            <circle cx="32" cy="22" r="12.5" fill="var(--accent)"/>
            <!-- Left & Right Ears -->
            <polygon points="20,17 21,5 29,12" fill="var(--accent)"/>
            <polygon points="22,15 22.5,8 27.5,12.5" fill="var(--surface)" opacity="0.55"/>
            <g class="cat-ear-r">
              <polygon points="35,12 43,5 44,17" fill="var(--accent)"/>
              <polygon points="36.5,12.5 41.5,8 42,15" fill="var(--surface)" opacity="0.55"/>
            </g>
            <!-- Eyes -->
            <circle class="cat-eye" cx="27" cy="21.5" r="2.1" fill="var(--bg)"/>
            <circle class="cat-eye" cx="37" cy="21.5" r="2.1" fill="var(--bg)"/>
            <!-- Little smile & nose -->
            <polygon points="31,24.5 33,24.5 32,26" fill="var(--bg)"/>
            <path d="M29.2 26.8 Q32 29 34.8 26.8" stroke="var(--bg)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            <!-- Little paws resting on edge -->
            <ellipse cx="23" cy="35" rx="4.2" ry="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
            <ellipse cx="41" cy="35" rx="4.2" ry="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="composer" id="composer">
          <div class="attachments" id="attachments"></div>
          <div class="composer-row">
            <button class="icon-btn" id="attachBtn" title="Attach image" aria-label="Attach image">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" multiple hidden />
            <textarea id="promptInput" rows="1" placeholder="Ask anything, or describe a change…"></textarea>
            <button class="send-btn" id="sendBtn" title="Send" aria-label="Send">
              <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <ellipse cx="12" cy="15.5" rx="4.4" ry="3.5"></ellipse>
                <circle cx="7.2" cy="10.2" r="1.9"></circle>
                <circle cx="10.4" cy="7.8" r="1.9"></circle>
                <circle cx="13.8" cy="7.8" r="1.9"></circle>
                <circle cx="16.9" cy="10.2" r="1.9"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="composer-hint" id="composerHint">Enter to send · Shift+Enter newline · ⌘K focus · Esc×2 rewind</div>
      </div>
    </footer>
  </div>

  <!-- Right Resource Monitor Panel -->
  <aside class="resource-panel" id="resourcePanel">
    <div class="res-header">
      <span>System Monitor</span>
      <button class="tiny-btn" id="resCloseBtn" title="Hide monitor">×</button>
    </div>
    <div class="res-scroll">
      <div class="res-card">
        <div class="res-card-title">
          <span>Typography</span>
        </div>
        <select class="pill-select" id="fontSelect" style="width:100%;max-width:none;border-radius:9px;" title="Choose font style">
          <option value="studio">Studio (Space Grotesk + Jakarta)</option>
          <option value="editorial">Claude Editorial (Newsreader Serif)</option>
          <option value="codex">Codex / Linear (Inter)</option>
          <option value="technical">Technical (IBM Plex Sans)</option>
        </select>
      </div>

      <div class="res-card">
        <div class="res-card-title">
          <span>Context</span>
          <button class="tiny-btn" id="compactBtn" title="Compact conversation context" style="width:auto;padding:1px 7px;font-size:11px;border:1px solid var(--border);background:var(--surface-subtle);">Compact</button>
        </div>
        <div class="res-metric">
          <div class="res-metric-row">
            <span>Window</span>
            <strong id="resCtxText">--</strong>
          </div>
          <div class="res-bar"><div class="res-bar-fill" id="resCtxBar" style="width:0%"></div></div>
        </div>
        <div class="res-list">
          <div class="res-item">
            <span class="res-item-name">Tokens (in / out)</span>
            <span class="res-item-val" id="resTokensText">--</span>
          </div>
          <div class="res-item">
            <span class="res-item-name">Estimated cost</span>
            <span class="res-item-val" id="resCostText">$0.000</span>
          </div>
        </div>
      </div>

      <div class="res-card">
        <div class="res-card-title">
          <span>Runtime Footprint</span>
          <span id="resMeowCpu">0% CPU</span>
        </div>
        <div class="res-big"><span id="resMeowTotal">--</span> <small>MB RSS</small></div>
        <div class="res-list" id="resSessionList"></div>
      </div>

      <div class="res-card">
        <div class="res-card-title">
          <span>Host System</span>
          <span id="resCores">-- cores</span>
        </div>
        <div class="res-metric">
          <div class="res-metric-row">
            <span>Memory</span>
            <strong id="resSysRam">-- / -- GB</strong>
          </div>
          <div class="res-bar"><div class="res-bar-fill" id="resRamBar" style="width:0%"></div></div>
        </div>
        <div class="res-metric">
          <div class="res-metric-row">
            <span>CPU</span>
            <strong id="resSysCpu">--%</strong>
          </div>
          <div class="res-bar"><div class="res-bar-fill" id="resCpuBar" style="width:0%"></div></div>
        </div>
        <div class="res-metric" id="resBattWrap" style="display:none">
          <div class="res-metric-row">
            <span>Battery</span>
            <strong id="resBattText">--%</strong>
          </div>
          <div class="res-bar"><div class="res-bar-fill" id="resBattBar" style="width:0%"></div></div>
        </div>
      </div>

      <div class="res-card">
        <div class="res-card-title">
          <span>Top Processes</span>
          <span>RAM</span>
        </div>
        <div class="res-list" id="resTopApps"></div>
      </div>
    </div>
  </aside>
</div>

<div class="toasts" id="toasts"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<script>
(() => {
  // ===== Cat Themes + Per-Theme Animated Backgrounds =====
  const root = document.documentElement;
  const themeSelect = document.getElementById("themeSelect");
  const bgStage = document.getElementById("bgStage");
  const validThemes = new Set(Array.from(themeSelect.options).map((o) => o.value));

  const BG_SHAPES = {
    paw: '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="15.5" rx="4.4" ry="3.5"/><circle cx="7.2" cy="10.2" r="1.9"/><circle cx="10.4" cy="7.8" r="1.9"/><circle cx="13.8" cy="7.8" r="1.9"/><circle cx="16.9" cy="10.2" r="1.9"/></svg>',
    petal: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 C16 6 19 11 16 17 C14 20 12 22 12 22 C12 22 10 20 8 17 C5 11 8 6 12 2 Z"/></svg>',

  // ===== Markdown Renderer =====
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderInline(text) {
    let s = escapeHtml(text);
    const codeSlots = [];
    s = s.replace(/`([^`\n]+)`/g, (_, code) => {
      const idx = codeSlots.length;
      codeSlots.push(`<code>${code}</code>`);
      return `\u0000CODE${idx}\u0000`;
    });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/\u0000CODE(\d+)\u0000/g, (_, idx) => codeSlots[Number(idx)]);
    return s;
  }

  function highlightCode(raw) {
    let s = escapeHtml(raw);
    const slots = [];
    const save = (cls, text) => {
      const i = slots.length;
      slots.push(`<span class="${cls}">${text}</span>`);
      return `\u0000TOK${i}\u0000`;
    };
    // Comments (//..., #..., /*...*/)
    s = s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|(^|\s)#[^\n]*)/gm, (m) => save("tok-com", m));
    // Strings
    s = s.replace(/(&quot;(?:\\.|[^&]|&(?!quot;))*?&quot;|'(?:\\.|[^'\n])*'|`(?:\\.|[^`])*`)/g, (m) => save("tok-str", m));
    // Keywords
    s = s.replace(/\b(const|let|var|function|return|async|await|import|from|export|default|if|else|for|while|switch|case|break|continue|try|catch|finally|throw|new|class|extends|interface|type|def|elif|pass|with|as|in|not|and|or|true|false|null|undefined|None|True|False)\b/g, '<span class="tok-kw">$1</span>');
    // Numbers
    s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
    // Function calls
    s = s.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="tok-fn">$1</span>');
    // Restore protected tokens
    s = s.replace(/\u0000TOK(\d+)\u0000/g, (_, idx) => slots[Number(idx)]);
    return s;
  }

  function renderMarkdown(md) {
    if (!md) return "";
    const lines = String(md).replace(/\r\n/g, "\n").split("\n");
    let html = "";
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      const fenceMatch = line.match(/^```([\w.+-]*)\s*$/);
      if (fenceMatch) {
        const lang = fenceMatch[1] || "code";
        const codeLines = [];
        i++;
        while (i < lines.length && !lines[i].match(/^```\s*$/)) {
          codeLines.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        html += `<div class="code-block"><div class="code-block-header"><span>${escapeHtml(lang)}</span><button class="code-copy-btn" type="button">Copy</button></div><pre><code>${highlightCode(codeLines.join("\n"))}</code></pre></div>`;
        continue;
      }

      if (!line.trim()) { i++; continue; }

      const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
      if (hMatch) {
        html += `<h${hMatch[1].length}>${renderInline(hMatch[2])}</h${hMatch[1].length}>`;
        i++;
        continue;
      }

      if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(line)) { html += "<hr />"; i++; continue; }

      if (line.startsWith(">")) {
        const qLines = [];
        while (i < lines.length && lines[i].startsWith(">")) {
          qLines.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        html += `<blockquote>${renderMarkdown(qLines.join("\n"))}</blockquote>`;
        continue;
      }

      if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(lines[i + 1])) {
        const parseRow = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        const headers = parseRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          rows.push(parseRow(lines[i]));
          i++;
        }
        html += `<div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${renderInline(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${renderInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) {
        const itemsHtml = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          itemsHtml.push(`<li>${renderInline(lines[i].replace(/^\s*[-*+]\s+/, ""))}</li>`);
          i++;
        }
        html += `<ul>${itemsHtml.join("")}</ul>`;
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        const firstNumMatch = line.match(/^\s*(\d+)\.\s+/);
        const startNum = firstNumMatch ? Number(firstNumMatch[1]) : 1;
        const itemsHtml = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          itemsHtml.push(`<li>${renderInline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
          i++;
        }
        const startAttr = startNum > 1 ? ` start="${startNum}"` : "";
        html += `<ol${startAttr}>${itemsHtml.join("")}</ol>`;
        continue;
      }

      const pLines = [];
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^```/.test(lines[i]) &&
        !/^#{1,4}\s+/.test(lines[i]) &&
        !/^>\s?/.test(lines[i]) &&
        !/^\s*[-*+]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i]) &&
        !/^(\*{3,}|-{3,}|_{3,})\s*$/.test(lines[i])
      ) {
        pLines.push(lines[i]);
        i++;
      }
      html += `<p>${pLines.map(renderInline).join("<br />")}</p>`;
    }
    return html;
  }

  threadEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".code-copy-btn");
    if (!btn) return;
    const code = btn.closest(".code-block")?.querySelector("pre code")?.textContent || "";
    navigator.clipboard.writeText(code).then(() => {

    });
  });

  // ===== Human-friendly tool labels =====
  function shortPath(p) {
    if (!p) return "";
    const parts = String(p).split("/").filter(Boolean);
    return parts.length > 2 ? `…/${parts.slice(-2).join("/")}` : String(p);
  }

  function formatToolLabel(name, args, status) {
    const a = args || {};
    const done = status !== "running";
    switch (name) {
      case "read": return `${done ? "Read" : "Reading"} ${shortPath(a.path) || "file"}`;
      case "edit": return `${done ? "Edited" : "Editing"} ${shortPath(a.path) || "file"}`;
      case "write": return `${done ? "Wrote" : "Writing"} ${shortPath(a.path) || "file"}`;
      case "bash": {
        const cmd = String(a.command || "").trim().split("\n")[0];
        const preview = cmd.length > 55 ? cmd.slice(0, 55) + "…" : cmd;
        return `${done ? "Ran" : "Running"}: ${preview || "command"}`;
      }
      case "codemode": return done ? "Ran tool script" : "Running tool script…";
      case "grep": return `${done ? "Searched" : "Searching"} for “${a.pattern || ""}”`;
      case "find": return `${done ? "Found files" : "Finding files"} ${a.pattern || ""}`.trim();
      case "ls": return `${done ? "Listed" : "Listing"} ${shortPath(a.path) || "directory"}`;
      default: return `${done ? "Used" : "Running"} ${name}`;
    }
  }

  function extractResultText(result) {
    if (!result) return "";
    if (typeof result === "string") return result;
    if (Array.isArray(result.content)) {
      return result.content.map((c) => (c.type === "text" ? c.text : `[${c.type}]`)).join("\n");
    }
    return JSON.stringify(result, null, 2);
  }

    for (const repo of workspaces) {
      for (const wt of repo.worktrees) {
        if (wt.path === cwd) return { repo, wt };
      }
    }
    return null;
  }

      <label>

        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repoPath: repo.path, worktreePath: wt.path, force: true }),

  // ===== Topbar & Controls =====

  // ===== Switch Workspace / Worktree =====
  async function selectWorkspace(cwd) {
    activeCwd = cwd;
    localStorage.setItem("pi-web-last-cwd", cwd);
    userScrolledUp = false;
    renderSidebar();
    const st = getSessionState(cwd);
    renderModelDropdown(st);
    updateControls();
    renderThread();

    if (!st.hydrated) {
      try {
        const [stateRes, modelsRes, levelsRes, msgsRes] = await Promise.all([
          rpc(cwd, { type: "get_state" }),
          rpc(cwd, { type: "get_available_models" }),
          rpc(cwd, { type: "get_available_thinking_levels" }),
          rpc(cwd, { type: "get_messages" }),
        ]);

        st.running = true;
        st.hydrated = true;

        if (modelsRes?.success && Array.isArray(modelsRes.data?.models)) {
          st.models = modelsRes.data.models;
        }
        if (stateRes?.success && stateRes.data) {
          st.isStreaming = Boolean(stateRes.data.isStreaming);
          st.currentModel = stateRes.data.model || null;
          st.thinkingLevel = stateRes.data.thinkingLevel || "medium";
        }
        if (levelsRes?.success && Array.isArray(levelsRes.data?.levels)) {
          st.thinkingLevels = levelsRes.data.levels;
        }
        if (msgsRes?.success && Array.isArray(msgsRes.data?.messages)) {
          hydrateSessionMessages(st, msgsRes.data.messages);
        }

        if (activeCwd === cwd) {
          renderModelDropdown(st);
          renderThread();
          scrollToBottom(true);
          updateControls();
          refreshSessionStats(cwd);
        }
        renderSidebar();
      } catch (err) {
        showToast(err.message || "Could not connect to Pi", "error");
      }
    } else {
      scrollToBottom(true);
      refreshSessionStats(cwd);
    }
    promptInput.focus();
  }

  function hydrateSessionMessages(st, messages) {
    st.items = [];
    st.toolMap.clear();
    st.activeAssistant = null;

    for (const msg of messages || []) {
      if (msg.role === "user") {
        let text = "";
        const images = [];
        if (typeof msg.content === "string") text = msg.content;
        else if (Array.isArray(msg.content)) {
          for (const part of msg.content) {
            if (part.type === "text") text += (text ? "\n" : "") + part.text;
            else if (part.type === "image") images.push({ data: part.data, mimeType: part.mimeType });
          }
        }
        st.items.push({ kind: "user", text, images });
      } else if (msg.role === "assistant") {
        const assistantItem = { kind: "assistant", streaming: false, blocks: [] };
        const content = Array.isArray(msg.content) ? msg.content : [];
        for (const part of content) {
          if (part.type === "thinking" && part.thinking) {
            assistantItem.blocks.push({ type: "thinking", text: part.thinking, streaming: false });
          } else if (part.type === "text" && part.text) {
            assistantItem.blocks.push({ type: "text", text: part.text, streaming: false });
          } else if (part.type === "toolCall") {
            const toolBlock = {
              type: "tool",
              toolCallId: part.id,
              toolName: part.name,
              args: part.arguments || {},
              output: "",
              status: "done",
              isError: false,
            };
            assistantItem.blocks.push(toolBlock);
            st.toolMap.set(part.id, toolBlock);
          }
        }
        if (msg.errorMessage) assistantItem.blocks.push({ type: "error", text: msg.errorMessage });
        if (assistantItem.blocks.length > 0) st.items.push(assistantItem);
      } else if (msg.role === "toolResult") {
        const existing = st.toolMap.get(msg.toolCallId);
        if (existing) {
          existing.output = extractResultText(msg);
          existing.isError = Boolean(msg.isError);
          existing.status = "done";
        }
      }
    }
  }

  // ===== Thread Rendering =====
  function renderToolElement(tool) {
    const details = document.createElement("details");
    details.className = "disclosure";
    if (tool._open) details.open = true;
    details.addEventListener("toggle", () => { tool._open = details.open; });

    const summary = document.createElement("summary");
    const statusIcon = tool.status === "running"
      ? '<span class="spinner"></span>'
      : tool.isError ? '<span class="tool-err">✕</span>' : '<span class="tool-ok">✓</span>';
    const dur = typeof tool.durationMs === "number"
      ? (tool.durationMs < 1000 ? `${tool.durationMs}ms` : `${(tool.durationMs / 1000).toFixed(1)}s`)
      : "";

    const badgeMap = { read: "READ", edit: "EDIT", write: "WRITE", bash: "SHELL", codemode: "SCRIPT", grep: "SEARCH", find: "FIND", ls: "LIST" };
    const badgeText = badgeMap[tool.toolName] || String(tool.toolName || "TOOL").toUpperCase().slice(0, 8);

    summary.innerHTML = `
      <span class="chevron">▶</span>
      ${statusIcon}
      <span class="tool-badge">${escapeHtml(badgeText)}</span>
      <span class="disclosure-title">${escapeHtml(formatToolLabel(tool.toolName, tool.args, tool.status))}</span>
      <span class="disclosure-meta">${escapeHtml(dur)}</span>
    `;
    details.appendChild(summary);

    const body = document.createElement("div");
    body.className = "disclosure-body mono";
    let bodyHtml = "";
    if (tool.args && Object.keys(tool.args).length > 0) {
      bodyHtml += `<div class="tool-section-label">Input</div>${escapeHtml(JSON.stringify(tool.args, null, 2))}`;
    }
    if (tool.output) {
      const clipped = tool.output.length > 6000 ? tool.output.slice(0, 6000) + "\n… (truncated)" : tool.output;
      bodyHtml += `<div class="tool-section-label">Output</div>${escapeHtml(clipped)}`;
    }
    body.innerHTML = bodyHtml || "No details";
    details.appendChild(body);
    return details;
  }

  function buildAssistantContent(item) {
    const wrap = document.createElement("div");
    wrap.className = "assistant-content";

    for (const block of item.blocks) {
      if (block.type === "thinking" && block.text) {
        const det = document.createElement("details");
        det.className = "disclosure";
        if (block._open) det.open = true;
        det.addEventListener("toggle", () => { block._open = det.open; });
        det.innerHTML = `
          <summary>
            <span class="chevron">▶</span>
            ${block.streaming ? '<span class="spinner"></span>' : ""}
            <span class="disclosure-title">${block.streaming ? "Thinking…" : "Thought process"}</span>
          </summary>
          <div class="disclosure-body">${escapeHtml(block.text)}</div>
        `;
        wrap.appendChild(det);
      } else if (block.type === "tool") {
        wrap.appendChild(renderToolElement(block));
      } else if (block.type === "text" && block.text) {
        const prose = document.createElement("div");
        prose.className = "prose";
        prose.innerHTML = renderMarkdown(block.text);
        wrap.appendChild(prose);
      } else if (block.type === "error") {
        const errDiv = document.createElement("div");
        errDiv.className = "error-note";
        errDiv.textContent = block.text;
        wrap.appendChild(errDiv);
      }
    }

    if (item.streaming && item.blocks.length === 0) {
      const dots = document.createElement("div");
      dots.className = "streaming-dots";
      dots.innerHTML = "<span>🐾</span><span>🐾</span><span>🐾</span>";
      wrap.appendChild(dots);
    }

    if (!item.streaming) {
      const fullText = item.blocks.filter((b) => b.type === "text" && b.text).map((b) => b.text).join("\n\n");
      if (fullText) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "msg-action-btn";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(fullText).then(() => {
            copyBtn.textContent = "Copied";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 1300);
          });
        };
        actions.appendChild(copyBtn);
        wrap.appendChild(actions);
      }
    }
    return wrap;
  }

  function renderMessageRow(item, userIndex = -1) {
    const row = document.createElement("div");
    row.className = `msg-row ${item.kind}`;

    if (item.kind === "user") {
      const bubble = document.createElement("div");
      bubble.className = "user-bubble";
      if (item.images && item.images.length > 0) {
        const imgsDiv = document.createElement("div");
        imgsDiv.className = "user-images";
        for (const img of item.images) {
          const el = document.createElement("img");
          el.src = `data:${img.mimeType};base64,${img.data}`;
          el.alt = "Attached image";
          imgsDiv.appendChild(el);
        }
        bubble.appendChild(imgsDiv);
      }
      if (item.text) {
        const textNode = document.createElement("div");
        textNode.textContent = item.text;
        bubble.appendChild(textNode);
      }
      row.appendChild(bubble);

      if (userIndex >= 0) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const rwBtn = document.createElement("button");
        rwBtn.type = "button";
        rwBtn.className = "msg-action-btn";
        rwBtn.title = "Rewind conversation back to this message and edit it";
        rwBtn.textContent = "↺ Rewind";
        rwBtn.onclick = () => rewindToUserIndex(userIndex);
        actions.appendChild(rwBtn);

        if (item.text) {
          const cpBtn = document.createElement("button");
          cpBtn.type = "button";
          cpBtn.className = "msg-action-btn";
          cpBtn.textContent = "Copy";
          cpBtn.onclick = () => {
            navigator.clipboard.writeText(item.text).then(() => {
              cpBtn.textContent = "Copied";
              setTimeout(() => { cpBtn.textContent = "Copy"; }, 1300);
            });
          };
          actions.appendChild(cpBtn);
        }
        row.appendChild(actions);
      }
    } else if (item.kind === "assistant") {
      row.appendChild(buildAssistantContent(item));
    }
    return row;
  }

  function renderThread() {
    if (!activeCwd) return;
    const st = getSessionState(activeCwd);

    if (st.items.length === 0) {
      const meta = findActiveMeta(activeCwd);
      const label = meta
        ? `${meta.repo.name}${meta.wt.branch ? ` (${meta.wt.branch})` : ""}`
        : (activeCwd === homeDir ? "Quick chat" : shortPath(activeCwd));
      threadEl.innerHTML = `

            <ellipse cx="48" cy="58" rx="25" ry="18" fill="var(--accent)" opacity="0.92"/>
            <circle cx="48" cy="36" r="19" fill="var(--accent)"/>
