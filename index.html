        sendBtn.title = "Stop generating";
        sendIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor" stroke="none"></rect>';
      }
      composerHint.textContent = "Running · Press Esc or Stop to abort, or type to steer";
    } else {
      sendBtn.classList.remove("stop");
      sendBtn.disabled = !promptInput.value.trim() && pendingImages.length === 0;
      sendBtn.title = "Send";
      sendIcon.innerHTML = pawSvg;
      composerHint.textContent = "Enter to send · Shift+Enter newline · ⌘K focus · Esc×2 rewind";
    }
  }

  // ===== Switch Workspace / Worktree =====
  async function selectWorkspace(cwd) {
    activeCwd = cwd;
    localStorage.setItem("pi-web-last-cwd", cwd);
    userScrolledUp = false;
    renderSidebar();
    const st = getSessionState(cwd);
    renderModelDropdown(st);
    updateControls();
    renderThread();

    if (!st.hydrated) {
      try {
        const [stateRes, modelsRes, levelsRes, msgsRes] = await Promise.all([
          rpc(cwd, { type: "get_state" }),
          rpc(cwd, { type: "get_available_models" }),
          rpc(cwd, { type: "get_available_thinking_levels" }),
          rpc(cwd, { type: "get_messages" }),
        ]);

        st.running = true;
        st.hydrated = true;

        if (modelsRes?.success && Array.isArray(modelsRes.data?.models)) {
          st.models = modelsRes.data.models;
        }
        if (stateRes?.success && stateRes.data) {
          st.isStreaming = Boolean(stateRes.data.isStreaming);
          st.currentModel = stateRes.data.model || null;
          st.thinkingLevel = stateRes.data.thinkingLevel || "medium";
        }
        if (levelsRes?.success && Array.isArray(levelsRes.data?.levels)) {
          st.thinkingLevels = levelsRes.data.levels;
        }
        if (msgsRes?.success && Array.isArray(msgsRes.data?.messages)) {
          hydrateSessionMessages(st, msgsRes.data.messages);
        }

        if (activeCwd === cwd) {
          renderModelDropdown(st);
          renderThread();
          scrollToBottom(true);
          updateControls();
          refreshSessionStats(cwd);
        }
        renderSidebar();
      } catch (err) {
        showToast(err.message || "Could not connect to Pi", "error");
      }
    } else {
      scrollToBottom(true);
      refreshSessionStats(cwd);
    }
    promptInput.focus();
  }

  function hydrateSessionMessages(st, messages) {
    st.items = [];
    st.toolMap.clear();
    st.activeAssistant = null;

    for (const msg of messages || []) {
      if (msg.role === "user") {
        let text = "";
        const images = [];
        if (typeof msg.content === "string") text = msg.content;
        else if (Array.isArray(msg.content)) {
          for (const part of msg.content) {
            if (part.type === "text") text += (text ? "\n" : "") + part.text;
            else if (part.type === "image") images.push({ data: part.data, mimeType: part.mimeType });
          }
        }
        st.items.push({ kind: "user", text, images });
      } else if (msg.role === "assistant") {
        const assistantItem = { kind: "assistant", streaming: false, blocks: [] };
        const content = Array.isArray(msg.content) ? msg.content : [];
        for (const part of content) {
          if (part.type === "thinking" && part.thinking) {
            assistantItem.blocks.push({ type: "thinking", text: part.thinking, streaming: false });
          } else if (part.type === "text" && part.text) {
            assistantItem.blocks.push({ type: "text", text: part.text, streaming: false });
          } else if (part.type === "toolCall") {
            const toolBlock = {
              type: "tool",
              toolCallId: part.id,
              toolName: part.name,
              args: part.arguments || {},
              output: "",
              status: "done",
              isError: false,
            };
            assistantItem.blocks.push(toolBlock);
            st.toolMap.set(part.id, toolBlock);
          }
        }
        if (msg.errorMessage) assistantItem.blocks.push({ type: "error", text: msg.errorMessage });
        if (assistantItem.blocks.length > 0) st.items.push(assistantItem);
      } else if (msg.role === "toolResult") {
        const existing = st.toolMap.get(msg.toolCallId);
        if (existing) {
          existing.output = extractResultText(msg);
          existing.isError = Boolean(msg.isError);
          existing.status = "done";
        }
      }
    }
  }

  // ===== Thread Rendering =====
  function renderToolElement(tool) {
    const details = document.createElement("details");
    details.className = "disclosure";
    if (tool._open) details.open = true;
    details.addEventListener("toggle", () => { tool._open = details.open; });

    const summary = document.createElement("summary");
    const statusIcon = tool.status === "running"
      ? '<span class="spinner"></span>'
      : tool.isError ? '<span class="tool-err">✕</span>' : '<span class="tool-ok">✓</span>';
    const dur = typeof tool.durationMs === "number"
      ? (tool.durationMs < 1000 ? `${tool.durationMs}ms` : `${(tool.durationMs / 1000).toFixed(1)}s`)
      : "";

    const badgeMap = { read: "READ", edit: "EDIT", write: "WRITE", bash: "SHELL", codemode: "SCRIPT", grep: "SEARCH", find: "FIND", ls: "LIST" };
    const badgeText = badgeMap[tool.toolName] || String(tool.toolName || "TOOL").toUpperCase().slice(0, 8);

    summary.innerHTML = `
      <span class="chevron">▶</span>
      ${statusIcon}
      <span class="tool-badge">${escapeHtml(badgeText)}</span>
      <span class="disclosure-title">${escapeHtml(formatToolLabel(tool.toolName, tool.args, tool.status))}</span>
      <span class="disclosure-meta">${escapeHtml(dur)}</span>
    `;
    details.appendChild(summary);

    const body = document.createElement("div");
    body.className = "disclosure-body mono";
    let bodyHtml = "";
    if (tool.args && Object.keys(tool.args).length > 0) {
      bodyHtml += `<div class="tool-section-label">Input</div>${escapeHtml(JSON.stringify(tool.args, null, 2))}`;
    }
    if (tool.output) {
      const clipped = tool.output.length > 6000 ? tool.output.slice(0, 6000) + "\n… (truncated)" : tool.output;
      bodyHtml += `<div class="tool-section-label">Output</div>${escapeHtml(clipped)}`;
    }
    body.innerHTML = bodyHtml || "No details";
    details.appendChild(body);
    return details;
  }

  function buildAssistantContent(item) {
    const wrap = document.createElement("div");
    wrap.className = "assistant-content";

    for (const block of item.blocks) {
      if (block.type === "thinking" && block.text) {
        const det = document.createElement("details");
        det.className = "disclosure";
        if (block._open) det.open = true;
        det.addEventListener("toggle", () => { block._open = det.open; });
        det.innerHTML = `
          <summary>
            <span class="chevron">▶</span>
            ${block.streaming ? '<span class="spinner"></span>' : ""}
            <span class="disclosure-title">${block.streaming ? "Thinking…" : "Thought process"}</span>
          </summary>
          <div class="disclosure-body">${escapeHtml(block.text)}</div>
        `;
        wrap.appendChild(det);
      } else if (block.type === "tool") {
        wrap.appendChild(renderToolElement(block));
      } else if (block.type === "text" && block.text) {
        const prose = document.createElement("div");
        prose.className = "prose";
        prose.innerHTML = renderMarkdown(block.text);
        wrap.appendChild(prose);
      } else if (block.type === "error") {
        const errDiv = document.createElement("div");
        errDiv.className = "error-note";
        errDiv.textContent = block.text;
        wrap.appendChild(errDiv);
      }
    }

    if (item.streaming && item.blocks.length === 0) {
      const dots = document.createElement("div");
      dots.className = "streaming-dots";
      dots.innerHTML = "<span>🐾</span><span>🐾</span><span>🐾</span>";
      wrap.appendChild(dots);
    }

    if (!item.streaming) {
      const fullText = item.blocks.filter((b) => b.type === "text" && b.text).map((b) => b.text).join("\n\n");
      if (fullText) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "msg-action-btn";
        copyBtn.textContent = "Copy";
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(fullText).then(() => {
            copyBtn.textContent = "Copied";
            setTimeout(() => { copyBtn.textContent = "Copy"; }, 1300);
          });
        };
        actions.appendChild(copyBtn);
        wrap.appendChild(actions);
      }
    }
    return wrap;
  }

  function renderMessageRow(item, userIndex = -1) {
    const row = document.createElement("div");
    row.className = `msg-row ${item.kind}`;

    if (item.kind === "user") {
      const bubble = document.createElement("div");
      bubble.className = "user-bubble";
      if (item.images && item.images.length > 0) {
        const imgsDiv = document.createElement("div");
        imgsDiv.className = "user-images";
        for (const img of item.images) {
          const el = document.createElement("img");
          el.src = `data:${img.mimeType};base64,${img.data}`;
          el.alt = "Attached image";
          imgsDiv.appendChild(el);
        }
        bubble.appendChild(imgsDiv);
      }
      if (item.text) {
        const textNode = document.createElement("div");
        textNode.textContent = item.text;
        bubble.appendChild(textNode);
      }
      row.appendChild(bubble);

      if (userIndex >= 0) {
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const rwBtn = document.createElement("button");
        rwBtn.type = "button";
        rwBtn.className = "msg-action-btn";
        rwBtn.title = "Rewind conversation back to this message and edit it";
        rwBtn.textContent = "↺ Rewind";
        rwBtn.onclick = () => rewindToUserIndex(userIndex);
        actions.appendChild(rwBtn);

        if (item.text) {
          const cpBtn = document.createElement("button");
          cpBtn.type = "button";
          cpBtn.className = "msg-action-btn";
          cpBtn.textContent = "Copy";
          cpBtn.onclick = () => {
            navigator.clipboard.writeText(item.text).then(() => {
              cpBtn.textContent = "Copied";
              setTimeout(() => { cpBtn.textContent = "Copy"; }, 1300);
            });
          };
          actions.appendChild(cpBtn);
        }
        row.appendChild(actions);
      }
    } else if (item.kind === "assistant") {
      row.appendChild(buildAssistantContent(item));
    }
    return row;
  }

    for (const item of st.items) {

  let renderTimer = null;
  let lastRenderAt = 0;
  function scheduleRender(immediate = false) {
    if (immediate) {
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
      lastRenderAt = performance.now();
      renderThread();
      return;
    }
    const elapsed = performance.now() - lastRenderAt;
    if (elapsed >= 55) {
      if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
      lastRenderAt = performance.now();
      requestAnimationFrame(() => renderThread());
    } else if (!renderTimer) {
      renderTimer = setTimeout(() => {
        renderTimer = null;
        lastRenderAt = performance.now();
        requestAnimationFrame(() => renderThread());
      }, 55 - elapsed);
    }
  }

  // ===== Handle Pi Events (for any worktree) =====
  function ensureActiveAssistant(st) {
    if (!st.activeAssistant) {
      st.activeAssistant = { kind: "assistant", streaming: true, blocks: [], _byIndex: new Map() };
      st.items.push(st.activeAssistant);
    }
    return st.activeAssistant;
  }

  function handlePiEvent(cwd, ev) {
    const st = getSessionState(cwd);
    const isActive = cwd === activeCwd;

    switch (ev.type) {
      case "agent_start":
        st.isStreaming = true;
        st.running = true;
        if (isActive) updateControls();
        renderSidebar();
        break;

      case "message_start": {
        const m = ev.message;
        if (!m) break;
        if (m.role === "user") {
          const last = st.items[st.items.length - 1];
          let text = "";
          const images = [];
          if (typeof m.content === "string") text = m.content;
          else if (Array.isArray(m.content)) {
            for (const p of m.content) {
              if (p.type === "text") text += (text ? "\n" : "") + p.text;
              else if (p.type === "image") images.push({ data: p.data, mimeType: p.mimeType });
            }
          }
          if (!(last && last.kind === "user" && last._optimistic)) {
            st.items.push({ kind: "user", text, images });
          } else {
            last._optimistic = false;
          }
        } else if (m.role === "assistant") {
          st.activeAssistant = { kind: "assistant", streaming: true, blocks: [], _byIndex: new Map() };
          st.items.push(st.activeAssistant);
        }
        if (isActive) scheduleRender();
        break;
      }

      case "message_update": {
        const u = ev.assistantMessageEvent;
        if (!u) break;
        const asst = ensureActiveAssistant(st);
        const idx = u.contentIndex;

        if (u.type === "thinking_start") {
          const blk = { type: "thinking", text: "", streaming: true };
          asst._byIndex.set(idx, blk);
          asst.blocks.push(blk);
        } else if (u.type === "thinking_delta") {
          let blk = asst._byIndex.get(idx);
          if (!blk) { blk = { type: "thinking", text: "", streaming: true }; asst._byIndex.set(idx, blk); asst.blocks.push(blk); }
          blk.text += u.delta || "";
        } else if (u.type === "thinking_end") {
          const blk = asst._byIndex.get(idx);
          if (blk) { blk.text = u.content ?? blk.text; blk.streaming = false; }
        } else if (u.type === "text_start") {
          const blk = { type: "text", text: "", streaming: true };
          asst._byIndex.set(idx, blk);
          asst.blocks.push(blk);
        } else if (u.type === "text_delta") {
          let blk = asst._byIndex.get(idx);
          if (!blk) { blk = { type: "text", text: "", streaming: true }; asst._byIndex.set(idx, blk); asst.blocks.push(blk); }
          blk.text += u.delta || "";
        } else if (u.type === "text_end") {
          const blk = asst._byIndex.get(idx);
          if (blk) { blk.text = u.content ?? blk.text; blk.streaming = false; }
        } else if (u.type === "toolcall_start") {
          const blk = { type: "tool", toolCallId: u.id, toolName: u.toolName, args: {}, output: "", status: "running", isError: false };
          asst._byIndex.set(idx, blk);
          asst.blocks.push(blk);
          if (u.id) st.toolMap.set(u.id, blk);
        } else if (u.type === "toolcall_end" && u.toolCall) {
          const blk = asst._byIndex.get(idx) || st.toolMap.get(u.toolCall.id);
          if (blk) {
            blk.toolCallId = u.toolCall.id;
            blk.toolName = u.toolCall.name;
            blk.args = u.toolCall.arguments || {};
            st.toolMap.set(u.toolCall.id, blk);
          }
        }
        if (isActive) scheduleRender();
        break;
      }

      case "message_end": {
        const m = ev.message;
        if (m && m.role === "assistant" && st.activeAssistant) {
          st.activeAssistant.streaming = false;
          if (m.errorMessage) st.activeAssistant.blocks.push({ type: "error", text: m.errorMessage });
          for (const b of st.activeAssistant.blocks) if (b.streaming) b.streaming = false;
          if (isActive) scheduleRender();
        }
        break;
      }

      case "tool_execution_start": {
        let blk = st.toolMap.get(ev.toolCallId);
        if (!blk) {
          const asst = ensureActiveAssistant(st);
          blk = { type: "tool", toolCallId: ev.toolCallId, toolName: ev.toolName, args: ev.args || {}, output: "", status: "running", isError: false };
          asst.blocks.push(blk);
          st.toolMap.set(ev.toolCallId, blk);
        } else {
          blk.toolName = ev.toolName || blk.toolName;
          blk.args = ev.args || blk.args;
          blk.status = "running";
        }
        if (isActive) scheduleRender();
        break;
      }

      case "tool_execution_update": {
        const blk = st.toolMap.get(ev.toolCallId);
        if (blk && ev.partialResult) {
          blk.output = extractResultText(ev.partialResult);
          if (isActive) scheduleRender();
        }
        break;
      }

      case "tool_execution_end": {
        const blk = st.toolMap.get(ev.toolCallId);
        if (blk) {
          blk.status = "done";
          blk.isError = Boolean(ev.isError);
          blk.durationMs = ev.durationMs;
          blk.output = extractResultText(ev.result);
          if (isActive) scheduleRender();
        }
        break;
      }

      case "agent_settled":
        st.isStreaming = false;
        if (st.activeAssistant) {
          st.activeAssistant.streaming = false;
          st.activeAssistant = null;
        }
        if (isActive) { updateControls(); scheduleRender(); refreshSessionStats(cwd); }
        renderSidebar();
        break;

      case "thinking_level_changed":
        st.thinkingLevel = ev.level;
        if (isActive && thinkingSelect.style.display !== "none") thinkingSelect.value = ev.level;
        break;

      case "auto_retry_start":
        if (isActive) showToast(`Retrying (${ev.attempt}/${ev.maxAttempts}): ${ev.errorMessage || "transient error"}`, "warning");
        break;
    }
  }

  // ===== Extension UI Requests =====
  function respondExtUI(cwd, response) {
    delete modalBox.dataset.locked;
    closeModal();
    fetch("/api/extension-ui-response", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cwd, response }),
    });
  }

  function handleExtensionUI(cwd, req) {
    if (req.method === "notify") {
      showToast(req.message || "", req.notifyType || "info");
      return;
    }
    if (req.method === "set_editor_text" && cwd === activeCwd && typeof req.text === "string") {
      promptInput.value = req.text;
      autoResizeInput();
      updateControls();
      return;
    }
    if (req.method === "confirm") {
      modalBox.dataset.locked = "1";
      openModal(`
        <h3>${escapeHtml(req.title || "Confirm")}</h3>
        ${req.message ? `<p>${escapeHtml(req.message)}</p>` : ""}
        <div class="modal-actions">
          <button class="btn-secondary" id="mCancel">Cancel</button>
          <button class="btn-primary" id="mOk">Confirm</button>
        </div>
      `);
      modalBox.querySelector("#mCancel").onclick = () => respondExtUI(cwd, { id: req.id, confirmed: false });
      modalBox.querySelector("#mOk").onclick = () => respondExtUI(cwd, { id: req.id, confirmed: true });
      return;
    }
    if (req.method === "select") {
      modalBox.dataset.locked = "1";
      const opts = Array.isArray(req.options) ? req.options : [];
      openModal(`
        <h3>${escapeHtml(req.title || "Choose an option")}</h3>
        <div class="modal-options"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="mCancel">Cancel</button>
        </div>
      `);
      const list = modalBox.querySelector(".modal-options");
      for (const opt of opts) {
        const b = document.createElement("button");
        b.className = "modal-option";
        b.textContent = opt;
        b.onclick = () => respondExtUI(cwd, { id: req.id, value: opt });
        list.appendChild(b);
      }
      modalBox.querySelector("#mCancel").onclick = () => respondExtUI(cwd, { id: req.id, cancelled: true });
      return;
    }
    if (req.method === "input" || req.method === "editor") {
      modalBox.dataset.locked = "1";
      const isMulti = req.method === "editor";
      openModal(`
        <h3>${escapeHtml(req.title || "Input")}</h3>
        ${isMulti
          ? `<textarea class="modal-textarea" id="mVal">${escapeHtml(req.prefill || "")}</textarea>`
          : `<input class="modal-input" id="mVal" placeholder="${escapeHtml(req.placeholder || "")}" />`}
        <div class="modal-actions">
          <button class="btn-secondary" id="mCancel">Cancel</button>
          <button class="btn-primary" id="mOk">Submit</button>
        </div>
      `);
      const valEl = modalBox.querySelector("#mVal");
      valEl.focus();
      modalBox.querySelector("#mCancel").onclick = () => respondExtUI(cwd, { id: req.id, cancelled: true });
      modalBox.querySelector("#mOk").onclick = () => respondExtUI(cwd, { id: req.id, value: valEl.value });
    }
  }

  // ===== Model / Thinking / New Chat =====
  modelSelect.addEventListener("change", async () => {
    if (!activeCwd) return;
    const [provider, modelId] = modelSelect.value.split("::");
    if (!provider || !modelId) return;
    const st = getSessionState(activeCwd);
    const res = await rpc(activeCwd, { type: "set_model", provider, modelId });
    if (!res.success) {
      showToast(res.error || "Failed to switch model", "error");
      return;
    }
    st.currentModel = res.data;
    const levelsRes = await rpc(activeCwd, { type: "get_available_thinking_levels" });
    st.thinkingLevels = levelsRes?.success && Array.isArray(levelsRes.data?.levels) ? levelsRes.data.levels : [];
    renderModelDropdown(st);
  });

  thinkingSelect.addEventListener("change", async () => {
    if (!activeCwd) return;
    const st = getSessionState(activeCwd);
    const res = await rpc(activeCwd, { type: "set_thinking_level", level: thinkingSelect.value });
    if (res.success) st.thinkingLevel = thinkingSelect.value;
    else showToast(res.error || "Failed to update thinking level", "error");
  });

  newChatBtn.addEventListener("click", async () => {
    if (!activeCwd) return;
    const st = getSessionState(activeCwd);
    if (st.isStreaming) {
      await rpc(activeCwd, { type: "clear_queue" });
      await rpc(activeCwd, { type: "abort" });
    }
    const res = await rpc(activeCwd, { type: "new_session" });
    if (res.success && !res.data?.cancelled) {
      st.items = [];
      st.toolMap.clear();
      st.activeAssistant = null;
      st.isStreaming = false;
      renderThread();
      updateControls();
      renderSidebar();
      refreshSessionStats(activeCwd);
      promptInput.focus();
    }
  });

  // ===== Rewind / Fork =====
  async function performFork(cwd, entryId) {
    const st = getSessionState(cwd);
    if (st.isStreaming) {
      await rpc(cwd, { type: "clear_queue" });
      await rpc(cwd, { type: "abort" });
    }
    const res = await rpc(cwd, { type: "fork", entryId });
    if (!res.success) {
      showToast(res.error || "Could not rewind", "error");
      return;
    }
    if (res.data?.cancelled) {
      showToast("Rewind cancelled", "warning");
      return;
    }
    const msgsRes = await rpc(cwd, { type: "get_messages" });
    if (msgsRes?.success && Array.isArray(msgsRes.data?.messages)) {
      hydrateSessionMessages(st, msgsRes.data.messages);
    }
    st.isStreaming = false;
    if (typeof res.data?.text === "string" && res.data.text) {
      promptInput.value = res.data.text;
      autoResizeInput();
    }
    renderThread();
    updateControls();
    refreshSessionStats(cwd);
    showToast("Rewound! Edit your message and press Enter to resend.", "info");
    promptInput.focus();
  }

  async function rewindToUserIndex(userIdx) {
    if (!activeCwd) return;
    const cwd = activeCwd;
    const res = await rpc(cwd, { type: "get_fork_messages" });
    const msgs = res?.success && Array.isArray(res.data?.messages) ? res.data.messages : [];
    const target = msgs[userIdx];
    if (!target) {
      showToast("No rewind point found for this message", "warning");
      return;
    }
    await performFork(cwd, target.entryId);
  }

  async function openRewindModal() {
    if (!activeCwd) return;
    const cwd = activeCwd;
    const res = await rpc(cwd, { type: "get_fork_messages" });
    const msgs = res?.success && Array.isArray(res.data?.messages) ? res.data.messages : [];
    if (msgs.length === 0) {
      showToast("Nothing to rewind yet in this conversation", "info");
      return;
    }
    openModal(`
      <h3>↺ Rewind conversation</h3>
      <p>Pick a previous message to fork back to. Its text will be restored into your input box so you can edit and resend.</p>
      <div class="modal-options" id="rewindList"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="mCancel">Cancel</button>
      </div>
    `);
    const list = modalBox.querySelector("#rewindList");
    msgs.slice().reverse().forEach((m, revIdx) => {
      const turnNum = msgs.length - revIdx;
      const preview = String(m.text || "").replace(/\s+/g, " ").trim();
      const b = document.createElement("button");
      b.className = "modal-option";
      b.innerHTML = `<strong style="color:var(--accent);margin-right:6px;">#${turnNum}</strong>${escapeHtml(preview.length > 110 ? preview.slice(0, 110) + "…" : preview || "(empty)")}`;
      b.onclick = async () => {
        closeModal();
        await performFork(cwd, m.entryId);
      };
      list.appendChild(b);
    });
    modalBox.querySelector("#mCancel").onclick = closeModal;
  }

  rewindBtn.addEventListener("click", openRewindModal);

  // ===== Session Context Stats & Compact =====
  const compactBtn = document.getElementById("compactBtn");
  const resCtxText = document.getElementById("resCtxText");
  const resCtxBar = document.getElementById("resCtxBar");
  const resTokensText = document.getElementById("resTokensText");
  const resCostText = document.getElementById("resCostText");

  function fmtNum(n) {
    if (!n) return "0";
    if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M`;
    if (n >= 1000) return `${(n / 1000).toFixed(1)}k`;
    return String(n);
  }

  async function refreshSessionStats(cwd) {
    if (!cwd || cwd !== activeCwd) return;
    try {
      const res = await rpc(cwd, { type: "get_session_stats" });
      if (!res?.success || !res.data || cwd !== activeCwd) return;
      const d = res.data;
      if (d.contextUsage && d.contextUsage.contextWindow) {
        const pct = d.contextUsage.percent ?? 0;
        const used = d.contextUsage.tokens ?? 0;
        resCtxText.textContent = `${fmtNum(used)} / ${fmtNum(d.contextUsage.contextWindow)} (${Math.round(pct)}%)`;
        resCtxBar.style.width = `${Math.min(100, pct)}%`;
        resCtxBar.className = `res-bar-fill ${barLevel(pct)}`;
      } else {
        resCtxText.textContent = "0%";
        resCtxBar.style.width = "0%";
        resCtxBar.className = "res-bar-fill";
      }
      if (d.tokens) {
        resTokensText.textContent = `${fmtNum(d.tokens.input)} / ${fmtNum(d.tokens.output)}`;
      }
      resCostText.textContent = `$${(d.cost || 0).toFixed(3)}`;
    } catch {}
  }

  compactBtn.addEventListener("click", async () => {
    if (!activeCwd) return;
    const cwd = activeCwd;
    compactBtn.disabled = true;
    compactBtn.textContent = "…";
    try {
      const res = await rpc(cwd, { type: "compact" });
      if (res?.success) {
        showToast("Conversation context compacted!", "info");
        refreshSessionStats(cwd);
      } else {
        showToast(res?.error || "Nothing to compact yet", "warning");
      }
    } finally {
      compactBtn.disabled = false;
      compactBtn.textContent = "Compact";
    }
  });

  // ===== Keyboard Shortcuts =====
  let lastEscTime = 0;
  document.addEventListener("keydown", async (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      promptInput.focus();
      return;
    }
    if (e.key === "Escape") {
      if (modalBackdrop.classList.contains("open")) {
        if (!modalBox.dataset.locked) closeModal();
        return;
      }
      if (!activeCwd) return;
      const st = getSessionState(activeCwd);
      if (st.isStreaming) {
        await rpc(activeCwd, { type: "clear_queue" });
        await rpc(activeCwd, { type: "abort" });
        showToast("Stopped", "info");
        return;
      }
      if (!promptInput.value.trim()) {
        const now = Date.now();
        if (now - lastEscTime < 550) {
          lastEscTime = 0;
          openRewindModal();
        } else {
          lastEscTime = now;
        }
      }
    }
  });

  // ===== Composer & Images =====
  function autoResizeInput() {
    promptInput.style.height = "auto";
    promptInput.style.height = Math.min(promptInput.scrollHeight, 200) + "px";
  }

  promptInput.addEventListener("input", () => { autoResizeInput(); updateControls(); });
  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (promptInput.value.trim() || pendingImages.length > 0) sendMessage();
    }
  });

  function renderAttachments() {
    attachmentsEl.innerHTML = "";
    pendingImages.forEach((img, idx) => {
      const chip = document.createElement("div");
      chip.className = "att-chip";
      chip.innerHTML = `<img src="${img.previewUrl}" alt="Attachment" /><button class="att-remove" type="button" title="Remove">×</button>`;
      chip.querySelector(".att-remove").onclick = () => {
        pendingImages.splice(idx, 1);
        renderAttachments();
        updateControls();
      };
      attachmentsEl.appendChild(chip);
    });
  }

  function addImageFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = String(reader.result || "");
        const comma = dataUrl.indexOf(",");
        if (comma === -1) return;
        pendingImages.push({ data: dataUrl.slice(comma + 1), mimeType: file.type, previewUrl: dataUrl });
        renderAttachments();
        updateControls();
      };
      reader.readAsDataURL(file);
    }
  }

  attachBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { if (fileInput.files) addImageFiles(fileInput.files); fileInput.value = ""; });
  promptInput.addEventListener("paste", (e) => {
    const imgs = [];
    for (const it of e.clipboardData?.items || []) {
      if (it.type.startsWith("image/")) { const f = it.getAsFile(); if (f) imgs.push(f); }
    }
    if (imgs.length > 0) addImageFiles(imgs);
  });
  composerEl.addEventListener("dragover", (e) => { e.preventDefault(); composerEl.classList.add("dragover"); });
  composerEl.addEventListener("dragleave", () => composerEl.classList.remove("dragover"));
  composerEl.addEventListener("drop", (e) => {
    e.preventDefault();
    composerEl.classList.remove("dragover");
    if (e.dataTransfer?.files) addImageFiles(e.dataTransfer.files);
  });

  async function sendMessage() {
    if (!activeCwd) return;
    const cwd = activeCwd;
    const st = getSessionState(cwd);
    const text = promptInput.value.trim();
    const imgs = pendingImages.map(({ data, mimeType }) => ({ type: "image", data, mimeType }));

    if (st.isStreaming && !text && imgs.length === 0) {
      await rpc(cwd, { type: "clear_queue" });
      await rpc(cwd, { type: "abort" });
      return;
    }
    if (!text && imgs.length === 0) return;

    triggerThemeBurst();
    promptInput.value = "";
    pendingImages = [];
    autoResizeInput();
    renderAttachments();
    userScrolledUp = false;

    if (!st.isStreaming) {
      st.items.push({ kind: "user", text, images: imgs, _optimistic: true });
      st.isStreaming = true;
      st.running = true;
      renderThread();
      scrollToBottom(true);
      updateControls();
      renderSidebar();

      const payload = { type: "prompt", message: text };
      if (imgs.length > 0) payload.images = imgs;
      const res = await rpc(cwd, payload);
      if (!res.success) {
        st.isStreaming = false;
        showToast(res.error || "Failed to send message", "error");
        updateControls();
        renderSidebar();
      } else if (res.data?.disposition === "handled") {
        st.isStreaming = false;
        updateControls();
        renderSidebar();
      }
    } else {
      const payload = { type: "steer", message: text };
      if (imgs.length > 0) payload.images = imgs;
      const res = await rpc(cwd, payload);
      if (res.success) showToast("Queued steering message", "info");
      else showToast(res.error || "Could not steer", "error");
      updateControls();
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  // ===== SSE =====
  function connectEvents() {
    const es = new EventSource("/events");
    es.addEventListener("session_status", (e) => {
      const data = JSON.parse(e.data);
      const st = getSessionState(data.cwd);
      st.running = Boolean(data.running);
      st.isStreaming = Boolean(data.isStreaming);
      if (data.cwd === activeCwd) updateControls();
      renderSidebar();
    });
    es.addEventListener("pi_event", (e) => {
      const { cwd, event } = JSON.parse(e.data);
      handlePiEvent(cwd, event);
    });
    es.addEventListener("extension_ui", (e) => {
      const { cwd, request } = JSON.parse(e.data);
      handleExtensionUI(cwd, request);
    });
  }

  // ===== Boot =====
  async function boot() {
    connectEvents();
    const res = await fetch("/api/workspaces").then((r) => r.json());
    if (res.success) {
      homeDir = res.homeDir || "";
      platform = res.platform || "darwin";
      workspaces = res.workspaces || [];
      renderSidebar();

      const lastCwd = localStorage.getItem("pi-web-last-cwd");
      const firstWt = workspaces[0]?.worktrees?.[0]?.path;
      const initial = res.launchCwd
        || (lastCwd && (lastCwd === homeDir || findActiveMeta(lastCwd)) ? lastCwd : null)
        || firstWt
        || homeDir;

      if (initial) await selectWorkspace(initial);
    }
  }

  // ===== Perched Cat Petting & Roaming Oneko Toggle =====
  const perchedCatEl = document.getElementById("perchedCat");
  const catBubbleEl = document.getElementById("catBubble");
  const catPhrases = ["purr ♡", "meow! ♪", "nyaa~", "*headbonk*", "mrrp! ♡", "prrr~"];
  let bubbleTimer = null;

  perchedCatEl.addEventListener("click", () => {
    perchedCatEl.classList.remove("hop");
    void perchedCatEl.offsetWidth;
    perchedCatEl.classList.add("hop");
    const t = root.dataset.theme;
    const phrases = t === "gojo-satoru"
      ? ["Hollow Purple!", "Limitless ∞", "Nah, I'd win."]
      : t === "rdr2-outlaw"
        ? ["Dead Eye!", "You're alright, boah.", "Outlaws for life."]
        : catPhrases;
    catBubbleEl.textContent = phrases[Math.floor(Math.random() * phrases.length)];
    catBubbleEl.classList.add("show");
    triggerThemeBurst();
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => catBubbleEl.classList.remove("show"), 1300);
  });

  const onekoToggle = document.getElementById("onekoToggle");
  let onekoLoaded = false;
  let onekoEnabled = localStorage.getItem("meow-don-oneko") !== "off";

  function applyOnekoState() {
    onekoToggle.textContent = onekoEnabled ? "🐾 Roaming cat: On" : "🐾 Roaming cat: Off";
    localStorage.setItem("meow-don-oneko", onekoEnabled ? "on" : "off");
    const existing = document.getElementById("oneko");
    if (onekoEnabled) {
      if (existing) {
        existing.style.display = "block";
      } else if (!onekoLoaded) {
        onekoLoaded = true;
        const s = document.createElement("script");
        s.src = "/oneko.js";
        s.dataset.cat = "/oneko.gif";
        document.body.appendChild(s);
      }
    } else if (existing) {
      existing.style.display = "none";
    }
  }

  onekoToggle.addEventListener("click", () => {
    onekoEnabled = !onekoEnabled;
    applyOnekoState();
  });

  // ===== Right Resource Monitor =====
  const resourcePanel = document.getElementById("resourcePanel");
  const resourceToggle = document.getElementById("resourceToggle");
  const resCloseBtn = document.getElementById("resCloseBtn");
  const ramBadge = document.getElementById("ramBadge");
  const resMeowTotal = document.getElementById("resMeowTotal");
  const resMeowCpu = document.getElementById("resMeowCpu");
  const resSessionList = document.getElementById("resSessionList");
  const resCores = document.getElementById("resCores");
  const resSysRam = document.getElementById("resSysRam");
  const resRamBar = document.getElementById("resRamBar");
  const resSysCpu = document.getElementById("resSysCpu");
  const resCpuBar = document.getElementById("resCpuBar");
  const resBattWrap = document.getElementById("resBattWrap");
  const resBattText = document.getElementById("resBattText");
  const resBattBar = document.getElementById("resBattBar");
  const resTopApps = document.getElementById("resTopApps");

  if (localStorage.getItem("meow-don-res-panel") === "closed" || window.innerWidth < 1024) {
    resourcePanel.classList.add("collapsed");
  }

  function toggleResourcePanel(forceClosed) {
    const collapsed = typeof forceClosed === "boolean"
      ? forceClosed
      : !resourcePanel.classList.contains("collapsed");
    resourcePanel.classList.toggle("collapsed", collapsed);
    localStorage.setItem("meow-don-res-panel", collapsed ? "closed" : "open");
    if (!collapsed) pollResources();
  }

  resourceToggle.addEventListener("click", () => toggleResourcePanel());
  resCloseBtn.addEventListener("click", () => toggleResourcePanel(true));

  function fmtMem(mb) {
    return mb >= 1024 ? `${(mb / 1024).toFixed(2)} GB` : `${Math.round(mb)} MB`;
  }

  function barLevel(pct) {
    return pct >= 85 ? "high" : pct >= 65 ? "warn" : "";
  }

  async function pollResources() {
    if (document.hidden) return;
    try {
      const res = await fetch("/api/resources").then((r) => r.json());
      if (!res.success) return;

      const { meowDon, system } = res;
      ramBadge.textContent = fmtMem(meowDon.totalMb);
      resMeowTotal.textContent = meowDon.totalMb.toFixed(1);
      const totalCpu = Math.round((meowDon.serverCpu + meowDon.sessions.reduce((a, s) => a + s.cpu, 0)) * 10) / 10;
      resMeowCpu.textContent = `${totalCpu}% CPU`;

      // Meow-Don breakdown (server + browser tab JS heap + Pi sessions)
      resSessionList.innerHTML = "";
      const tabJsMb = performance.memory?.usedJSHeapSize
        ? Math.round((performance.memory.usedJSHeapSize / (1024 * 1024)) * 10) / 10
        : null;

      const srvRow = document.createElement("div");
      srvRow.className = "res-item";
      srvRow.innerHTML = `<span class="res-item-name">Web UI server</span><span class="res-item-val">${meowDon.serverMb} MB</span>`;
      resSessionList.appendChild(srvRow);

      if (tabJsMb !== null) {
        const tabRow = document.createElement("div");
        tabRow.className = "res-item";
        tabRow.title = "Memory used by this Meow-Don browser tab (JS heap)";
        tabRow.innerHTML = `<span class="res-item-name">Meow-Don tab (JS)</span><span class="res-item-val">${tabJsMb} MB</span>`;
        resSessionList.appendChild(tabRow);
      }

      for (const s of meowDon.sessions) {
        const row = document.createElement("div");
        row.className = "res-item";
        row.title = `${s.cwd} (PID ${s.pid})`;
        row.innerHTML = `
          <span class="res-item-name">pi · ${escapeHtml(s.name)}</span>
          <span class="res-item-val">${s.ramMb} MB</span>
          <button class="tiny-btn danger stop-pi" title="Stop Pi session to free RAM">×</button>
        `;
        row.querySelector(".stop-pi").onclick = async () => {
          await fetch("/api/session/stop", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ cwd: s.cwd }),
          });
          showToast(`Stopped Pi in ${s.name}`, "info");
          pollResources();
        };
        resSessionList.appendChild(row);
      }

      // System stats
      resCores.textContent = `${system.cores} cores`;
      resSysRam.textContent = `${system.usedRamGb} / ${system.totalRamGb} GB (${system.ramPercent}%)`;
      resRamBar.style.width = `${Math.min(100, system.ramPercent)}%`;
      resRamBar.className = `res-bar-fill ${barLevel(system.ramPercent)}`;

      resSysCpu.textContent = `${system.cpuPercent}% · load ${system.load1}`;
      resCpuBar.style.width = `${Math.min(100, system.cpuPercent)}%`;
      resCpuBar.className = `res-bar-fill ${barLevel(system.cpuPercent)}`;

      if (system.battery) {
        resBattWrap.style.display = "";
        resBattText.textContent = `${system.battery.percent}% · ${system.battery.state}`;
        resBattBar.style.width = `${Math.min(100, system.battery.percent)}%`;
        resBattBar.className = `res-bar-fill ${system.battery.percent <= 20 ? "high" : ""}`;
      } else {
        resBattWrap.style.display = "none";
      }

      resTopApps.innerHTML = "";
      for (const app of system.topApps || []) {
        const row = document.createElement("div");
        row.className = "res-item";
        const isChrome = /chrome/i.test(app.name);
        row.innerHTML = `<span class="res-item-name">${escapeHtml(app.name)}</span><span class="res-item-val">${fmtMem(app.ramMb)}</span>`;
        resTopApps.appendChild(row);
        if (isChrome && tabJsMb !== null) {
          const sub = document.createElement("div");
          sub.className = "res-item";
          sub.style.paddingLeft = "10px";
          sub.style.opacity = "0.8";
          sub.innerHTML = `<span class="res-item-name" style="color:var(--accent);">↳ Meow-Don tab</span><span class="res-item-val" style="color:var(--accent);">${tabJsMb} MB</span>`;
          resTopApps.appendChild(sub);
        }
      }
    } catch {}
  }

  pollResources();
  setInterval(() => {
    if (document.hidden) return;
    pollResources();
  }, 6000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pollResources(); });

  // ===== Away Privacy Blur + Enlarged Roaming Cat =====
  const awayBlurToggle = document.getElementById("awayBlurToggle");
  let awayBlurEnabled = localStorage.getItem("meow-don-away-blur") !== "off";

  function updateAwayBlurBtn() {
    awayBlurToggle.textContent = awayBlurEnabled ? "👁 Away blur: On" : "👁 Away blur: Off";
    localStorage.setItem("meow-don-away-blur", awayBlurEnabled ? "on" : "off");
    if (!awayBlurEnabled) document.body.classList.remove("away-blur");
  }

  function setAway(away) {
    if (!awayBlurEnabled) return;
    document.body.classList.toggle("away-blur", away);
  }

  document.documentElement.addEventListener("mouseleave", () => setAway(true));
  document.documentElement.addEventListener("mouseenter", () => setAway(false));
  window.addEventListener("blur", () => setAway(true));
  window.addEventListener("focus", () => setAway(false));

  awayBlurToggle.addEventListener("click", () => {
    awayBlurEnabled = !awayBlurEnabled;
    updateAwayBlurBtn();
  });

  // ===== Font Style Selector =====
  const fontSelect = document.getElementById("fontSelect");
  const validFonts = new Set(Array.from(fontSelect.options).map((o) => o.value));
  function applyFont(fontId) {
    const chosen = validFonts.has(fontId) ? fontId : "studio";
    root.dataset.font = chosen;
    fontSelect.value = chosen;
    localStorage.setItem("meow-don-font", chosen);
  }
  applyFont(localStorage.getItem("meow-don-font") || "studio");
  fontSelect.addEventListener("change", () => applyFont(fontSelect.value));

  updateAwayBlurBtn();
  applyOnekoState();
  boot();
})();
</script>
</body>
</html>
