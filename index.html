  * { box-sizing: border-box; }

  /* Subtle themed scrollbars */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.62;
    letter-spacing: -0.011em;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .shell {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    transition: filter 0.28s ease, opacity 0.28s ease;
  }

  body.away-blur .shell {
    filter: blur(6px);
    opacity: 0.78;
    user-select: none;
  }

  #oneko {
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transform-origin: center center;
  }

  body.away-blur #oneko {
    transform: scale(2.8);
    z-index: 2147483647 !important;
  }

  /* ===== Sidebar ===== */
  aside.sidebar {
    position: relative;
    z-index: 6;
    width: 272px;
    flex: 0 0 272px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: margin-left 0.2s ease;
  }

  aside.sidebar.collapsed {
    margin-left: -272px;
  }

  .sidebar-header {
    padding: 13px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 650;
    font-size: 15.5px;
    letter-spacing: -0.02em;
  }

  .brand-mark {
    width: 25px;
    height: 25px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13.5px;
  }

  .sidebar-actions {
    padding: 10px 12px 6px;
    display: flex;
    gap: 6px;
  }

  .add-project-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 550;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s, border-color 0.15s;
  }

  .add-project-btn:hover {
    background: var(--surface-subtle);
    border-color: var(--accent);
  }

  .sidebar-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sidebar-section-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    padding: 4px 8px 2px;
  }

  .repo-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .repo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 8px;
  }

  .repo-name {
    font-size: 12.5px;
    font-weight: 650;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }

  .repo-btns {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0.75;
  }

  .repo-header:hover .repo-btns {
    opacity: 1;
  }

  .tiny-btn {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    padding: 0;
  }

  .tiny-btn:hover {
    background: var(--surface);
    color: var(--text);
  }

  .tiny-btn.danger:hover {
    color: var(--danger);
  }

  .wt-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text);
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }

  .wt-item:hover {
    background: var(--surface-subtle);
  }

  .wt-item.active {
    background: var(--surface);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
    font-weight: 550;
  }

  .wt-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    opacity: 0.45;
    flex-shrink: 0;
  }

  .wt-dot.running {
    background: var(--success);
    opacity: 1;
  }

  .wt-dot.busy {
    background: var(--accent);
    opacity: 1;
    animation: pulse 1.2s ease-in-out infinite;
  }

  .wt-label {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .wt-tag {
    font-size: 10.5px;
    color: var(--text-faint);
    background: var(--surface-subtle);
    padding: 1px 6px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .wt-remove {
    opacity: 0;
    transition: opacity 0.12s;
  }

  .wt-item:hover .wt-remove {
    opacity: 1;
  }

  .sidebar-empty {
    padding: 18px 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.82); }
  }

  /* ===== Main Workspace ===== */
  .main-pane {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header.topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-strong);
    background: linear-gradient(90deg, var(--sidebar-bg) 0%, var(--bg) 52%, var(--sidebar-bg) 100%);
    box-shadow: inset 0 -1px 0 var(--accent-soft), var(--shadow-sm);
    z-index: 10;
    min-width: 0;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
  }

  .active-crumb {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    max-width: 240px;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .active-crumb .branch-sub {
    color: var(--accent);
    font-weight: 500;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    max-width: 100%;
  }

  select.pill-select,
  button.pill-btn {
    appearance: none;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 5px 10px;
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    outline: none;
  }

  select.pill-select:hover,
  button.pill-btn:hover {
    background-color: var(--accent-soft);
    border-color: var(--accent);
  }

  select.pill-select {
    max-width: 155px;
    padding-right: 22px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-muted) 50%),
                      linear-gradient(135deg, var(--text-muted) 50%, transparent 50%);
    background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
    background-size: 4.5px 4.5px, 4.5px 4.5px;
    background-repeat: no-repeat;
    text-overflow: ellipsis;
  }

  select.pill-select:hover,
  button.pill-btn:hover {
    background-color: var(--surface-subtle);
    border-color: var(--border-strong);
  }

  button.icon-btn {
    width: 34px;
    height: 34px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  button.icon-btn:hover {
    background: var(--surface-subtle);
    color: var(--text);
  }

  /* Transcript */
  main#scrollContainer {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px 20px 44px;
    position: relative;
    z-index: 2;
    background: transparent;
    overscroll-behavior: contain;
  }

  .thread {
    position: relative;
    z-index: 3;
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ===== Per-Theme Animated Background Stage (Anchored strictly to .main-pane — NEVER hidden behind sidebars!) ===== */
  .bg-stage {
    position: absolute;
    top: 44px;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
    background-color: var(--bg);
    contain: strict;
  }

  .main-pane {
    position: relative;
    z-index: 1;
    background-color: var(--bg);
  }

  header.topbar, footer {
    position: relative;
    z-index: 5;
  }

  .bg-glow {
    position: absolute;
    border-radius: 50%;
    opacity: 0.72;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    animation: glowPulse 9s ease-in-out infinite alternate;
  }

  @keyframes glowPulse {
    0% { opacity: 0.45; transform: scale(0.96); }
    100% { opacity: 0.85; transform: scale(1.06); }
  }

  .bg-glow.g1 {
    width: 480px; height: 480px;
    top: -110px; left: 14%;
  }

  .bg-glow.g2 {
    width: 440px; height: 440px;
    bottom: 10px; right: 5%;
    animation-delay: -4.5s;
  }

  .bg-item {
    position: absolute;
    color: var(--accent);
    opacity: 0.24;
  }

  /* Gentle readability veil for cat themes; disabled for Gojo & RDR2 so full animations shine */
  .bg-stage::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(760px, 84%);
    background: linear-gradient(90deg, transparent 0%, var(--bg) 14%, var(--bg) 86%, transparent 100%);
    opacity: 0.36;
  }

  [data-theme="gojo-satoru"] .bg-stage::after,
  [data-theme="rdr2-outlaw"] .bg-stage::after {
    opacity: 0;
  }

  /* Motion presets per theme */
  .anim-fall {
    top: -40px;
    animation: bgFall var(--dur, 14s) linear var(--delay, 0s) infinite;
  }
  @keyframes bgFall {
    0% { transform: translate3d(0, -40px, 0) rotate(0deg); opacity: 0; }
    12% { opacity: var(--op, 0.28); }
    88% { opacity: var(--op, 0.28); }
    100% { transform: translate3d(var(--drift, 70px), 108vh, 0) rotate(var(--rot, 240deg)); opacity: 0; }
  }

  .anim-rise {
    bottom: -40px;
    animation: bgRise var(--dur, 16s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes bgRise {
    0% { transform: translate3d(0, 40px, 0) scale(0.85) rotate(0deg); opacity: 0; }
    15% { opacity: var(--op, 0.24); }
    85% { opacity: var(--op, 0.24); }
    100% { transform: translate3d(var(--drift, 35px), -106vh, 0) scale(1.1) rotate(var(--rot, 30deg)); opacity: 0; }
  }

  .anim-twinkle {
    animation: bgTwinkle var(--dur, 4.5s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes bgTwinkle {
    0%, 100% { transform: scale(0.75) rotate(0deg); opacity: 0.08; }
    50% { transform: scale(1.22) rotate(18deg); opacity: var(--op, 0.36); }
  }

  .anim-float {
    animation: bgFloat var(--dur, 11s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  @keyframes bgFloat {
    0% { transform: translate3d(0, 0, 0) rotate(-8deg); opacity: calc(var(--op, 0.22) * 0.75); }
    100% { transform: translate3d(var(--drift, 28px), -26px, 0) rotate(12deg); opacity: var(--op, 0.22); }
  }

  /* Theme-specific subtle ambient glow */
  [data-theme="sakura-neko"] .bg-glow.g1 { background: radial-gradient(circle, rgba(236, 114, 156, 0.22) 0%, transparent 70%); }
  [data-theme="black-cat-midnight"] .bg-glow.g1 { background: radial-gradient(circle, rgba(242, 177, 56, 0.18) 0%, transparent 70%); }
  [data-theme="russian-blue"] .bg-glow.g1 { background: radial-gradient(circle, rgba(78, 201, 148, 0.18) 0%, transparent 70%); }
  [data-theme="ginger-tabby"] .bg-glow.g1 { background: radial-gradient(circle, rgba(212, 98, 42, 0.19) 0%, transparent 70%); }
  [data-theme="siamese-cream"] .bg-glow.g1 { background: radial-gradient(circle, rgba(59, 110, 165, 0.18) 0%, transparent 70%); }

  /* Gojo Satoru & RDR2 signature background glows & animations */
  [data-theme="gojo-satoru"] .bg-glow.g1 {
    background: radial-gradient(circle, rgba(56, 189, 248, 0.28) 0%, transparent 70%);
  }
  [data-theme="gojo-satoru"] .bg-glow.g2 {
    background: radial-gradient(circle, rgba(244, 63, 94, 0.24) 0%, rgba(168, 85, 247, 0.16) 45%, transparent 72%);
  }
  [data-theme="rdr2-outlaw"] .bg-glow.g1 {
    background: radial-gradient(circle, rgba(204, 41, 54, 0.28) 0%, transparent 70%);
  }
  [data-theme="rdr2-outlaw"] .bg-glow.g2 {
    background: radial-gradient(circle, rgba(212, 155, 75, 0.22) 0%, transparent 70%);
  }

  /* Orbiting Hollow Purple / Limitless rings for Gojo */
  .anim-orbit {
    animation: bgOrbit var(--dur, 10s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  @keyframes bgOrbit {
    0% { transform: translate3d(0, 0, 0) scale(0.85) rotate(0deg); opacity: calc(var(--op, 0.35) * 0.6); }
    50% { transform: translate3d(var(--drift, 42px), -28px, 0) scale(1.18) rotate(180deg); opacity: var(--op, 0.35); }
    100% { transform: translate3d(calc(var(--drift, 42px) * -0.6), 24px, 0) scale(0.95) rotate(360deg); opacity: calc(var(--op, 0.35) * 0.8); }
  }

  /* Rising glowing campfire embers for RDR2 */
  .anim-ember {
    bottom: -24px;
    animation: bgEmber var(--dur, 9s) ease-out var(--delay, 0s) infinite;
  }
  @keyframes bgEmber {
    0% { transform: translate3d(0, 0, 0) scale(1.1); opacity: 0; }
    15% { opacity: var(--op, 0.55); }
    75% { opacity: var(--op, 0.45); }
    100% { transform: translate3d(var(--drift, 65px), -95vh, 0) scale(0.35) rotate(120deg); opacity: 0; }
  }

  /* RDR2 classic western title styling */
  [data-theme="rdr2-outlaw"] .empty-state h1,
  [data-theme="rdr2-outlaw"] .prose h1,
  [data-theme="rdr2-outlaw"] .prose h2 {
    letter-spacing: 0.015em;
    text-transform: uppercase;
  }

  [data-theme="rdr2-outlaw"] .brand {
    font-family: "Newsreader", Georgia, serif;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Gojo Satoru subtle Limitless glow on active accents */
  [data-theme="gojo-satoru"] .brand-mark {
    background: linear-gradient(135deg, #38bdf8 0%, #a855f7 55%, #f43f5e 100%);
  }

  [data-theme="gojo-satoru"] header.topbar {
    background: linear-gradient(90deg, rgba(56, 189, 248, 0.12) 0%, var(--sidebar-bg) 50%, rgba(168, 85, 247, 0.14) 100%);
  }

  [data-theme="rdr2-outlaw"] header.topbar {
    background: linear-gradient(90deg, rgba(204, 41, 54, 0.2) 0%, var(--sidebar-bg) 55%, rgba(212, 155, 75, 0.12) 100%);
    border-bottom-color: rgba(204, 41, 54, 0.45);
  }

  /* ===== Heavy Cinematic Animations for Gojo & RDR2 (GPU-composited) ===== */
  .scene-figure {
    position: absolute;
    pointer-events: none;
    user-select: none;
  }

  /* Gojo Satoru — Unlimited Void + Hollow Purple Collision */
  .gojo-void-ring {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 640px;
    height: 640px;
    margin-left: -320px;
    margin-top: -320px;
    border-radius: 50%;
    border: 1.5px dashed rgba(168, 85, 247, 0.28);
    animation: voidSpin 28s linear infinite;
  }

  .gojo-void-ring.r2 {
    width: 440px;
    height: 440px;
    margin-left: -220px;
    margin-top: -220px;
    border: 1.5px solid rgba(56, 189, 248, 0.22);
    animation: voidSpin 18s linear infinite reverse;
  }

  @keyframes voidSpin {
    from { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.06); }
    to { transform: rotate(360deg) scale(1); }
  }

  .gojo-figure {
    right: 16px;
    bottom: 108px;
    width: 230px;
    height: 280px;
    opacity: 0.88;
    animation: figureHover 4.2s ease-in-out infinite alternate;
  }

  .gojo-hand-glow {
    transform-origin: 42px 134px;
    animation: handCharge 2.2s ease-in-out infinite alternate;
  }

  @keyframes handCharge {
    0% { transform: scale(0.82); opacity: 0.7; }
    100% { transform: scale(1.38); opacity: 1; }
  }

  .hp-lightning {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 240px;
    height: 240px;
    margin: -120px 0 0 -120px;
    animation: hpBoltFlash 5.2s ease-out infinite;
  }

  @keyframes hpBoltFlash {
    0%, 46% { transform: scale(0.4) rotate(0deg); opacity: 0; }
    52% { transform: scale(1.1) rotate(12deg); opacity: 0.95; }
    64% { transform: scale(1.35) rotate(-8deg); opacity: 0.65; }
    78%, 100% { transform: scale(1.7) rotate(20deg); opacity: 0; }
  }

  @keyframes figureHover {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(0, -14px, 0); }
  }

  .gojo-attack-stage {
    position: absolute;
    left: 50%;
    top: 44%;
    width: 520px;
    height: 220px;
    margin-left: -260px;
    margin-top: -110px;
  }

  .hp-blue {
    position: absolute;
    left: 20px;
    top: 75px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(circle, #e0f2fe 15%, #38bdf8 50%, rgba(56, 189, 248, 0) 75%);
    animation: hpBlueMerge 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .hp-red {
    position: absolute;
    right: 20px;
    top: 75px;
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe4e6 15%, #f43f5e 50%, rgba(244, 63, 94, 0) 75%);
    animation: hpRedMerge 5.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .hp-purple {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 150px;
    height: 150px;
    margin-left: -75px;
    margin-top: -75px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 10%, #d8b4fe 32%, #a855f7 58%, rgba(168, 85, 247, 0) 75%);
    animation: hpPurpleBlast 5.2s ease-out infinite;
  }

  .hp-shockwave {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    margin-left: -60px;
    margin-top: -60px;
    border-radius: 50%;
    border: 3px solid #c084fc;
    animation: hpShockwave 5.2s ease-out infinite;
  }

  .hp-shockwave.s2 {
    border-color: #38bdf8;
    animation-delay: 0.16s;
  }

  @keyframes hpBlueMerge {
    0% { transform: translate3d(-40px, 0, 0) scale(0.7); opacity: 0; }
    18% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.85; }
    46% { transform: translate3d(206px, 0, 0) scale(1.15); opacity: 0.95; }
    54%, 100% { transform: translate3d(206px, 0, 0) scale(0.2); opacity: 0; }
  }

  @keyframes hpRedMerge {
    0% { transform: translate3d(40px, 0, 0) scale(0.7); opacity: 0; }
    18% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.85; }
    46% { transform: translate3d(-206px, 0, 0) scale(1.15); opacity: 0.95; }
    54%, 100% { transform: translate3d(-206px, 0, 0) scale(0.2); opacity: 0; }
  }

  @keyframes hpPurpleBlast {
    0%, 44% { transform: scale(0.1); opacity: 0; }
    52% { transform: scale(1.15); opacity: 0.85; }
    72% { transform: scale(2.1); opacity: 0.45; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  @keyframes hpShockwave {
    0%, 46% { transform: scale(0.2); opacity: 0; }
    52% { transform: scale(0.9); opacity: 0.75; }
    88% { transform: scale(4.8); opacity: 0; }
    100% { transform: scale(4.8); opacity: 0; }
  }

  /* Red Dead Redemption 2 — Outlaw Figure + Spinning Revolver + Dead Eye + Bullet Tracers */
  .rdr-sunset {
    position: absolute;
    left: 50%;
    bottom: -140px;
    width: 560px;
    height: 560px;
    margin-left: -280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(204, 41, 54, 0.34) 0%, rgba(212, 155, 75, 0.16) 45%, transparent 72%);
    animation: sunsetPulse 6s ease-in-out infinite alternate;
  }

  @keyframes sunsetPulse {
    0% { transform: scale(0.95); opacity: 0.7; }
    100% { transform: scale(1.08); opacity: 1; }
  }

  .rdr-figure {
    right: 14px;
    bottom: 102px;
    width: 245px;
    height: 285px;
    opacity: 0.9;
  }

  .rdr-revolver-arm {
    transform-origin: 84px 156px;
    animation: revolverRecoil 4.2s ease-out infinite;
  }

  @keyframes revolverRecoil {
    0%, 71% { transform: rotate(0deg); }
    74% { transform: rotate(15deg) translate3d(4px, -3px, 0); }
    82% { transform: rotate(-2deg); }
    90%, 100% { transform: rotate(0deg); }
  }

  .rdr-muzzle-flash {
    transform-origin: 6px 146px;
    animation: muzzleBang 4.2s ease-out infinite;
  }

  @keyframes muzzleBang {
    0%, 71% { transform: scale(0.1); opacity: 0; }
    73% { transform: scale(1.65); opacity: 1; }
    78% { transform: scale(0.8); opacity: 0.5; }
    82%, 100% { transform: scale(0.1); opacity: 0; }
  }

  .rdr-cylinder {
    position: absolute;
    left: 20px;
    bottom: 118px;
    width: 112px;
    height: 112px;
    opacity: 0.78;
    animation: cylinderSpin 4.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @keyframes cylinderSpin {
    0% { transform: rotate(0deg); }
    16% { transform: rotate(60deg); }
    32% { transform: rotate(60deg); }
    48% { transform: rotate(120deg); }
    64% { transform: rotate(120deg); }
    80% { transform: rotate(360deg); }
    100% { transform: rotate(360deg); }
  }

  .rdr-bullet {
    position: absolute;
    height: 3px;
    width: 140px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent 0%, #cc2936 40%, #fbbf24 85%, #ffffff 100%);
    animation: bulletStreak var(--dur, 4.4s) cubic-bezier(0.15, 0.85, 0.35, 1) var(--delay, 0s) infinite;
  }

  @keyframes bulletStreak {
    0%, 72% { transform: translate3d(-180px, 0, 0) scaleX(0.4); opacity: 0; }
    76% { opacity: 0.9; }
    92% { transform: translate3d(105vw, 0, 0) scaleX(1.3); opacity: 0.8; }
    100% { transform: translate3d(115vw, 0, 0) scaleX(0.6); opacity: 0; }
  }

  .rdr-deadeye {
    position: absolute;
    width: 44px;
    height: 44px;
    color: #cc2936;
    animation: deadEyeLock var(--dur, 4.4s) ease-out var(--delay, 0s) infinite;
  }

  @keyframes deadEyeLock {
    0%, 55% { transform: scale(1.9) rotate(45deg); opacity: 0; }
    66% { transform: scale(1) rotate(0deg); opacity: 0.65; }
    78% { transform: scale(0.92) rotate(0deg); opacity: 0.85; }
    88% { transform: scale(1.35) rotate(0deg); opacity: 0; }
    100% { opacity: 0; }
  }

  /* On-send cinematic burst overlay */
  .fx-burst {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 55;
    overflow: hidden;
  }

  .fx-purple-beam {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 140px;
    height: 140px;
    margin: -70px 0 0 -70px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 10%, #d8b4fe 35%, #a855f7 65%, transparent 78%);
    animation: fxBurstPurple 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fxBurstPurple {
    0% { transform: scale(0.2); opacity: 0.95; }
    100% { transform: scale(9.5); opacity: 0; }
  }

  .fx-revolver-shot {
    position: absolute;
    top: 38%;
    left: -160px;
    width: 240px;
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #cc2936 35%, #fbbf24 85%, #ffffff);
    box-shadow: 0 0 18px #fbbf24;
    animation: fxShot 0.45s cubic-bezier(0.12, 0.9, 0.25, 1) forwards;
  }

  @keyframes fxShot {
    0% { transform: translate3d(0, 0, 0); opacity: 1; }
    100% { transform: translate3d(125vw, -30px, 0); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-glow, .bg-item, .gojo-void-ring, .gojo-figure, .hp-blue, .hp-red, .hp-purple, .hp-shockwave, .rdr-sunset, .rdr-cylinder, .rdr-bullet, .rdr-deadeye {
      animation: none !important;
    }
  }

  /* ===== Cute Animated Cats (Pure CSS GPU-composited, ~0 RAM) ===== */
  .sidebar-kitty {
    padding: 8px 14px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-faint);
    user-select: none;
  }

  .sleeping-kitty-svg {
    width: 58px;
    height: 30px;
    overflow: visible;
  }

  .kitty-breathe {
    transform-origin: 30px 24px;
    animation: kittyBreathe 3.8s ease-in-out infinite;
  }

  @keyframes kittyBreathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.06); }
  }

  .kitty-zzz {
    font-size: 8px;
    font-weight: 700;
    fill: var(--accent);
    animation: floatZzz 2.8s ease-in-out infinite;
  }
  .kitty-zzz.z2 { animation-delay: 0.9s; }

  @keyframes floatZzz {
    0% { opacity: 0; transform: translate(0, 2px) scale(0.8); }
    40% { opacity: 0.9; }
    100% { opacity: 0; transform: translate(6px, -10px) scale(1.1); }
  }

  /* Perched Composer Cat */
  .composer-wrap {
    max-width: 760px;
    margin: 0 auto;
    position: relative;
  }

  .perched-cat-wrap {
    position: absolute;
    right: 26px;
    top: -33px;
    width: 68px;
    height: 38px;
    cursor: pointer;
    z-index: 3;
    user-select: none;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .perched-cat-wrap:hover {
    transform: translateY(-3px);
  }

  .perched-cat-wrap.hop {
    animation: catHop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes catHop {
    0%, 100% { transform: translateY(0); }
    45% { transform: translateY(-9px) scale(1.05); }
  }

  .perched-cat-bubble {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    box-shadow: var(--shadow-sm);
    transition: opacity 0.2s, transform 0.25s;
  }

  .perched-cat-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }

  .cat-eye {
    transform-origin: center;
    transform-box: fill-box;
    animation: catBlink 4.6s ease-in-out infinite;
  }

  @keyframes catBlink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }

  .cat-ear-r {
    transform-origin: 45px 15px;
    animation: earTwitch 6.5s ease-in-out infinite;
  }

  @keyframes earTwitch {
    0%, 88%, 94%, 100% { transform: rotate(0deg); }
    91% { transform: rotate(10deg); }
  }

  .cat-tail {
    transform-origin: 54px 31px;
    animation: tailSway 2.8s ease-in-out infinite;
  }

  .perched-cat-wrap.working .cat-tail {
    animation-duration: 0.9s;
  }

  @keyframes tailSway {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(14deg); }
  }

  /* Hero Kitty in Empty State */
  .hero-kitty {
    width: 84px;
    height: 74px;
    margin-bottom: -4px;
  }

  /* Cat-ear Send Button */
  .send-btn {
    position: relative;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
  }

  .send-btn::before,
  .send-btn::after {
    content: "";
    position: absolute;
    top: -4px;
    width: 10px;
    height: 10px;
    background: inherit;
    border-radius: 3px 8px 2px 2px;
    z-index: -1;
    transition: transform 0.16s;
  }

  .send-btn::before {
    left: 3px;
    transform: rotate(-18deg);
  }

  .send-btn::after {
    right: 3px;
    border-radius: 8px 3px 2px 2px;
    transform: rotate(18deg);
  }

  .send-btn:hover:not(:disabled) {
    background: var(--accent-hover);
    transform: translateY(-1px) scale(1.06);
  }

  .send-btn:active:not(:disabled) {
    transform: scale(0.94);
  }

  .send-btn:disabled { opacity: 0.4; cursor: default; }
  .send-btn.stop { background: var(--text); color: var(--bg); }

  /* Paw streaming indicator */
  .streaming-dots { display: inline-flex; gap: 6px; align-items: center; padding: 6px 2px; color: var(--accent); font-size: 13px; }
  .streaming-dots span {
    display: inline-block;
    animation: pawWalk 1.1s infinite ease-in-out;
  }
  .streaming-dots span:nth-child(2) { animation-delay: 0.18s; }
  .streaming-dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes pawWalk {
    0%, 80%, 100% { transform: translateY(0) scale(0.85); opacity: 0.35; }
    40% { transform: translateY(-4px) scale(1.1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .kitty-breathe, .kitty-zzz, .cat-eye, .cat-ear-r, .cat-tail, .streaming-dots span {
      animation: none !important;
    }
  }

  /* Duplicate .thread rule removed (defined above with z-index) */

  .empty-state {
    max-width: 560px;
    margin: 9vh auto 0;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .empty-state h1 {
    margin: 0;
    font-family: var(--font-heading);
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.22;
  }

  .empty-state p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-muted);
    max-width: 430px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }

  .suggestion-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font-sans);
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, border-color 0.15s, background 0.15s;
  }

  .suggestion-chip:hover {
    border-color: var(--border-strong);
    background: var(--surface-subtle);
    transform: translateY(-1px);
  }

  /* Messages */
  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.14s ease;
    padding: 0 2px;
  }

  .msg-row:hover .msg-actions,
  .msg-actions:focus-within {
    opacity: 1;
  }

  .msg-action-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-family: var(--font-sans);
    font-size: 11.5px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }

  .msg-action-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* Floating Scroll-to-bottom button */
  .scroll-bottom-btn {
    position: absolute;
    left: 50%;
    top: -42px;
    transform: translateX(-50%) translateY(6px);
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-md);
    border-radius: 999px;
    padding: 5px 13px;
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 550;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 6;
  }

  .scroll-bottom-btn.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  .scroll-bottom-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Table horizontal scroll wrapper */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    margin: 14px 0;
  }
  .table-wrap table { margin: 0; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { align-items: flex-end; }
  .msg-row.assistant { align-items: flex-start; }

  .user-bubble {
    max-width: 82%;
    background: var(--user-bubble);
    color: var(--text);
    padding: 10px 15px;
    border-radius: 16px 16px 4px 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
    line-height: 1.55;
    letter-spacing: -0.01em;
  }

  .user-images {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .user-images img {
    max-width: 220px;
    max-height: 180px;
    border-radius: 12px;
    border: 1px solid var(--border);
    object-fit: cover;
  }

  .assistant-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* Markdown prose — Codex / Cursor / Orca editorial hierarchy */
  .prose {
    font-family: var(--font-prose);
    color: var(--text);
    font-size: 15px;
    line-height: 1.7;
    letter-spacing: -0.008em;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  [data-font="editorial"] .prose {
    font-size: 16.5px;
    line-height: 1.72;
    letter-spacing: 0;
  }

  .prose > *:first-child { margin-top: 0; }
  .prose > *:last-child { margin-bottom: 0; }
  .prose p { margin: 0 0 12px; }
  .prose h1, .prose h2, .prose h3, .prose h4 {
    font-family: var(--font-heading);
    margin: 22px 0 9px;
    font-weight: 650;
    letter-spacing: -0.025em;
    line-height: 1.28;
    color: var(--text);
  }
  .prose h1 { font-size: 1.48em; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .prose h2 { font-size: 1.26em; }
  .prose h3 { font-size: 1.08em; color: var(--accent); }
  .prose h4 { font-size: 0.9em; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .prose strong { font-weight: 600; }
  .prose ul, .prose ol { margin: 0 0 11px; padding-left: 20px; }
  .prose li { margin: 3.5px 0; }
  .prose li::marker { color: var(--text-faint); }
  .prose blockquote {
    margin: 12px 0;
    padding: 6px 14px;
    border-left: 2.5px solid var(--accent);
    color: var(--text-muted);
    background: var(--surface-subtle);
    border-radius: 0 8px 8px 0;
    font-size: 13.8px;
  }
  .prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  .prose a:hover { border-bottom-color: var(--accent); }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .prose code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--code-bg);
    padding: 1.5px 5.5px;
    border-radius: 5px;
    border: 1px solid var(--border);
    letter-spacing: 0;
  }

  .code-block {
    margin: 12px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--code-bg);
    overflow: hidden;
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 12px;
    background: var(--code-header);
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }
  .code-copy-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .code-copy-btn:hover { background: var(--surface); color: var(--text); }
  .code-block pre {
    margin: 0;
    padding: 11px 14px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 12.6px;
    line-height: 1.56;
    letter-spacing: 0;
  }
  .code-block pre code { background: none; border: none; padding: 0; font-size: inherit; }
  .tok-kw { color: var(--syn-kw); font-weight: 500; }
  .tok-str { color: var(--syn-str); }
  .tok-num { color: var(--syn-num); }
  .tok-com { color: var(--syn-com); font-style: italic; }
  .tok-fn { color: var(--syn-fn); }

  .tool-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1.5px 6px;
    border-radius: 5px;
    background: var(--accent-soft);
    color: var(--accent);
    flex-shrink: 0;
  }

  .prose table { border-collapse: collapse; width: 100%; margin: 14px 0; font-size: 14px; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
  .prose th { background: var(--surface-subtle); font-weight: 600; }

  /* Disclosures */
  details.disclosure {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    overflow: hidden;
    font-size: 13.5px;
  }
  details.disclosure > summary {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    color: var(--text-muted);
  }
  details.disclosure > summary::-webkit-details-marker { display: none; }
  details.disclosure > summary:hover { background: var(--surface-subtle); }
  .chevron { display: inline-block; transition: transform 0.15s ease; font-size: 11px; color: var(--text-faint); }
  details.disclosure[open] > summary .chevron { transform: rotate(90deg); }
  .disclosure-title { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .disclosure-meta { font-size: 12px; color: var(--text-faint); flex-shrink: 0; }
  .disclosure-body {
    padding: 10px 14px 12px;
    border-top: 1px solid var(--border);
    background: var(--code-bg);
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.55;
    max-height: 360px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .disclosure-body.mono { font-family: var(--font-mono); font-size: 12.2px; }
  .tool-section-label {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin: 8px 0 4px;
  }
  .tool-section-label:first-child { margin-top: 0; }

  .spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-ok { color: var(--success); font-size: 13px; flex-shrink: 0; }
  .tool-err { color: var(--danger); font-size: 13px; flex-shrink: 0; }

  .streaming-dots { display: inline-flex; gap: 4px; align-items: center; padding: 6px 2px; }
  .streaming-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .streaming-dots span:nth-child(2) { animation-delay: 0.16s; }
  .streaming-dots span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.75); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .error-note {
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(196, 61, 61, 0.1);
    border: 1px solid rgba(196, 61, 61, 0.25);
    color: var(--danger);
    font-size: 14px;
  }

  /* Footer */
  footer {
    flex: 0 0 auto;
    padding: 20px 20px 18px;
    background: linear-gradient(to top, var(--bg) 82%, transparent);
  }
  .composer {
    position: relative;
    z-index: 4;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 22px;
    padding: 10px 12px 10px 16px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .composer:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
  }
  .composer.dragover { border-color: var(--accent); background: var(--accent-soft); }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; }
  .attachments:empty { display: none; }
  .att-chip { position: relative; width: 58px; height: 58px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .att-chip img { width: 100%; height: 100%; object-fit: cover; }
  .att-remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; border: none; background: rgba(0,0,0,0.65); color: #fff;
    font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .composer-row { display: flex; align-items: flex-end; gap: 8px; }
  textarea#promptInput {
    flex: 1 1 auto; border: none; outline: none; resize: none; background: transparent;
    color: var(--text); font-family: var(--font-sans); font-size: 14.5px; line-height: 1.5;
    letter-spacing: -0.01em; max-height: 200px; padding: 4px 0;
  }
  textarea#promptInput::placeholder { color: var(--text-faint); }
  .composer-hint { margin-top: 7px; text-align: center; font-size: 12px; color: var(--text-faint); }

  /* Toasts */
  .toasts {
    position: fixed; right: 20px; bottom: 92px;
    display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: 340px;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-md); border-radius: 12px; padding: 10px 14px;
    font-size: 13.5px; color: var(--text); animation: fadeIn 0.18s ease-out;
  }
  .toast.warning { border-left: 3px solid #d97706; }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.42); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%; max-width: 460px; background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: 18px; padding: 20px 22px;
    box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 14px;
  }
  .modal h3 { margin: 0; font-size: 17px; font-weight: 650; }
  .modal p { margin: 0; font-size: 14px; color: var(--text-muted); white-space: pre-wrap; }
  .modal label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--text-muted); font-weight: 500; }
  .modal-input, .modal-textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 10px 12px; font-family: var(--font-sans); font-size: 14.5px; outline: none;
  }
  .modal-input:focus, .modal-textarea:focus { border-color: var(--accent); }
  .modal-textarea { min-height: 120px; resize: vertical; }
  .modal-options { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .modal-option {
    text-align: left; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-family: var(--font-sans); font-size: 14px; cursor: pointer;
  }
  .modal-option:hover { border-color: var(--accent); background: var(--accent-soft); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 8px 16px; font-family: var(--font-sans); font-size: 14px; font-weight: 550; cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface-subtle); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; font-family: var(--font-sans); font-size: 14px; cursor: pointer;
  }

  /* ===== Right Resource Monitor Panel ===== */
  aside.resource-panel {
    position: relative;
    z-index: 6;
    width: 264px;
    flex: 0 0 264px;
    background: var(--sidebar-bg);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: margin-right 0.2s ease;
  }

  aside.resource-panel.collapsed {
    margin-right: -264px;
  }

  .res-header {
    padding: 13px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    font-weight: 650;
  }

  .res-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .res-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    box-shadow: var(--shadow-sm);
  }

  .res-card-title {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .res-big {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.15;
  }

  .res-big small {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .res-metric {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .res-metric-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .res-metric-row strong {
    color: var(--text);
    font-weight: 600;
  }

  .res-bar {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-subtle);
    overflow: hidden;
  }

  .res-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.35s ease;
  }

  .res-bar-fill.warn { background: #d97706; }
  .res-bar-fill.high { background: var(--danger); }

  .res-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .res-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 12.5px;
  }

  .res-item-name {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .res-item-val {
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    font-size: 12px;
  }

  .res-pill-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 768px) {
    aside.sidebar { position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; box-shadow: var(--shadow-lg); }
    aside.resource-panel { position: fixed; top: 0; bottom: 0; right: 0; z-index: 40; box-shadow: var(--shadow-lg); }
    select.pill-select { max-width: 135px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <span class="brand-mark">🐱</span>
        <span>Meow-Don</span>
      </div>
      <button class="icon-btn" id="refreshWsBtn" title="Refresh worktrees" style="width:28px;height:28px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <div class="sidebar-actions">
      <button class="add-project-btn" id="pickFolderBtn" title="Open repository or folder">

          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>

      <button class="tiny-btn" id="addPathBtn" title="Add repository by path" style="width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:10px;">
        /
      </button>
    </div>

    <div class="sidebar-scroll" id="sidebarList"></div>

    <div class="sidebar-kitty">
      <svg class="sleeping-kitty-svg" viewBox="0 0 64 32" aria-hidden="true">
        <g class="kitty-breathe">
          <!-- Curled body -->
          <ellipse cx="32" cy="23" rx="19" ry="8.5" fill="var(--accent)" opacity="0.88"/>
          <!-- Head -->
          <circle cx="19" cy="20" r="8" fill="var(--accent)"/>
          <!-- Ears -->
          <polygon points="12,15 14,8 19,13" fill="var(--accent)"/>
          <polygon points="20,13 24,8 26,15" fill="var(--accent)"/>
          <!-- Sleeping eyes -->
          <path d="M14.5 20.5 q2 1.8 4 0" stroke="var(--bg)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M20.5 20.5 q2 1.8 4 0" stroke="var(--bg)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- Curled tail -->
          <path d="M49 23 q8 -1 7 -7 q-1 -4 -6 -3" stroke="var(--accent)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        </g>
        <text class="kitty-zzz" x="27" y="10">z</text>
        <text class="kitty-zzz z2" x="34" y="6">Z</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
        <button class="tiny-btn" id="onekoToggle" title="Toggle roaming pixel cat" style="width:auto;padding:2px 8px;font-size:11.5px;border:1px solid var(--border);background:var(--surface);">🐾 Roaming cat: On</button>
        <button class="tiny-btn" id="awayBlurToggle" title="Blur screen & enlarge cat when mouse leaves tab" style="width:auto;padding:2px 8px;font-size:11px;border:1px solid var(--border);background:var(--surface);">👁 Away blur: On</button>
      </div>
    </div>
  </aside>

  <!-- Main Chat Pane -->
  <div class="main-pane">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <div class="active-crumb" id="activeCrumb" title="">
          <span class="wt-dot" id="activeDot"></span>
          <span id="activeTitle">Quick Chat</span>
          <span class="branch-sub" id="activeBranch"></span>
        </div>
      </div>

      <div class="topbar-right">
        <select class="pill-select" id="modelSelect" title="Model"></select>
        <select class="pill-select" id="thinkingSelect" title="Thinking level" style="display:none"></select>
        <select class="pill-select" id="themeSelect" title="Cat theme">
          <option value="catppuccin-mocha">🐱 Catppuccin Mocha</option>
          <option value="catppuccin-macchiato">🐱 Catppuccin Macchiato</option>
          <option value="catppuccin-frappe">🐱 Catppuccin Frappé</option>
          <option value="catppuccin-latte">🐱 Catppuccin Latte</option>
          <option value="ginger-tabby">🧡 Ginger Tabby</option>
          <option value="siamese-cream">💙 Siamese Cream</option>
          <option value="sakura-neko">🌸 Sakura Neko</option>
          <option value="russian-blue">💎 Russian Blue</option>
          <option value="tuxedo-cat">🎩 Tuxedo Cat</option>
          <option value="black-cat-midnight">🌙 Black Cat Midnight</option>

        <button class="pill-btn" id="rewindBtn" title="Rewind / fork from an earlier message (Esc twice)">↺ Rewind</button>
        <button class="pill-btn" id="newChatBtn" title="Start a fresh conversation in this worktree">New chat</button>
        <button class="pill-btn res-pill-badge" id="resourceToggle" title="Toggle resource monitor">

        </button>
      </div>
    </header>

    <div class="bg-stage" id="bgStage" aria-hidden="true"></div>

    <main id="scrollContainer">
      <div class="thread" id="thread"></div>
    </main>

    <footer>
      <div class="composer-wrap">
        <button class="scroll-bottom-btn" id="scrollBottomBtn" type="button">↓ Jump to latest</button>

            <path class="cat-tail" d="M54 32 Q66 28 65 16 Q64 10 59 12" stroke="var(--accent)" stroke-width="4.2" fill="none" stroke-linecap="round"/>

            <ellipse cx="34" cy="34" rx="20" ry="12" fill="var(--accent)"/>

            <polygon points="22,15 22.5,8 27.5,12.5" fill="var(--surface)" opacity="0.55"/>

              <polygon points="36.5,12.5 41.5,8 42,15" fill="var(--surface)" opacity="0.55"/>

            <circle class="cat-eye" cx="27" cy="21.5" r="2.1" fill="var(--bg)"/>
            <circle class="cat-eye" cx="37" cy="21.5" r="2.1" fill="var(--bg)"/>
            <!-- Little smile & nose -->
            <polygon points="31,24.5 33,24.5 32,26" fill="var(--bg)"/>
            <path d="M29.2 26.8 Q32 29 34.8 26.8" stroke="var(--bg)" stroke-width="1.3" fill="none" stroke-linecap="round"/>

            <ellipse cx="23" cy="35" rx="4.2" ry="3" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>

                <circle cx="10.4" cy="7.8" r="1.9"></circle>
                <circle cx="13.8" cy="7.8" r="1.9"></circle>
                <circle cx="16.9" cy="10.2" r="1.9"></circle>

        </div>

          <option value="codex">Codex / Linear (Inter)</option>

            <span class="res-item-name">Estimated cost</span>
            <span class="res-item-val" id="resCostText">$0.000</span>
          </div>
        </div>
      </div>

          <span>Runtime Footprint</span>
          <span id="resMeowCpu">0% CPU</span>
        </div>
        <div class="res-big"><span id="resMeowTotal">--</span> <small>MB RSS</small></div>
        <div class="res-list" id="resSessionList"></div>
      </div>

      <div class="res-card">
        <div class="res-card-title">
          <span>Host System</span>
          <span id="resCores">-- cores</span>
        </div>
        <div class="res-metric">

        <div class="res-metric" id="resBattWrap" style="display:none">

    ];
    for (const it of [...cfg.items, ...extraFlanks]) {
      const style = [
        `left:${it.left}`,
        it.top ? `top:${it.top}` : "",
        `--dur:${it.dur}`,
        `--delay:${it.delay}`,
        it.drift ? `--drift:${it.drift}` : "",
        it.rot ? `--rot:${it.rot}` : "",

      ].filter(Boolean).join(";");
      html += `<div class="bg-item ${cfg.motion}" style="${style}">${BG_SHAPES[it.shape] || BG_SHAPES.paw}</div>`;
    }
    bgStage.innerHTML = html;
  }

      const el = document.createElement("div");

    }, 4200);
  }

  // ===== Markdown Renderer =====
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderInline(text) {
    let s = escapeHtml(text);
    const codeSlots = [];
    s = s.replace(/`([^`\n]+)`/g, (_, code) => {
      const idx = codeSlots.length;
      codeSlots.push(`<code>${code}</code>`);
      return `\u0000CODE${idx}\u0000`;
    });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>");
    s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    s = s.replace(/\u0000CODE(\d+)\u0000/g, (_, idx) => codeSlots[Number(idx)]);
    return s;
  }

  function highlightCode(raw) {
    let s = escapeHtml(raw);
    const slots = [];
    const save = (cls, text) => {
      const i = slots.length;
      slots.push(`<span class="${cls}">${text}</span>`);
      return `\u0000TOK${i}\u0000`;
    };
    // Comments (//..., #..., /*...*/)
    s = s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*|(^|\s)#[^\n]*)/gm, (m) => save("tok-com", m));
    // Strings
    s = s.replace(/(&quot;(?:\\.|[^&]|&(?!quot;))*?&quot;|'(?:\\.|[^'\n])*'|`(?:\\.|[^`])*`)/g, (m) => save("tok-str", m));
    // Keywords
    s = s.replace(/\b(const|let|var|function|return|async|await|import|from|export|default|if|else|for|while|switch|case|break|continue|try|catch|finally|throw|new|class|extends|interface|type|def|elif|pass|with|as|in|not|and|or|true|false|null|undefined|None|True|False)\b/g, '<span class="tok-kw">$1</span>');
    // Numbers
    s = s.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-num">$1</span>');
    // Function calls
    s = s.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="tok-fn">$1</span>');
    // Restore protected tokens
    s = s.replace(/\u0000TOK(\d+)\u0000/g, (_, idx) => slots[Number(idx)]);
    return s;
  }

  function renderMarkdown(md) {
    if (!md) return "";
    const lines = String(md).replace(/\r\n/g, "\n").split("\n");
    let html = "";
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      const fenceMatch = line.match(/^```([\w.+-]*)\s*$/);
      if (fenceMatch) {
        const lang = fenceMatch[1] || "code";
        const codeLines = [];
        i++;
        while (i < lines.length && !lines[i].match(/^```\s*$/)) {
          codeLines.push(lines[i]);
          i++;
        }
        if (i < lines.length) i++;
        html += `<div class="code-block"><div class="code-block-header"><span>${escapeHtml(lang)}</span><button class="code-copy-btn" type="button">Copy</button></div><pre><code>${highlightCode(codeLines.join("\n"))}</code></pre></div>`;
        continue;
      }

      if (!line.trim()) { i++; continue; }

      const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
      if (hMatch) {
        html += `<h${hMatch[1].length}>${renderInline(hMatch[2])}</h${hMatch[1].length}>`;
        i++;
        continue;
      }

      if (/^(\*{3,}|-{3,}|_{3,})\s*$/.test(line)) { html += "<hr />"; i++; continue; }

      if (line.startsWith(">")) {
        const qLines = [];
        while (i < lines.length && lines[i].startsWith(">")) {
          qLines.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        html += `<blockquote>${renderMarkdown(qLines.join("\n"))}</blockquote>`;
        continue;
      }

      if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(lines[i + 1])) {
        const parseRow = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        const headers = parseRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
          rows.push(parseRow(lines[i]));
          i++;
        }
        html += `<div class="table-wrap"><table><thead><tr>${headers.map((h) => `<th>${renderInline(h)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${renderInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)) {
        const itemsHtml = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          itemsHtml.push(`<li>${renderInline(lines[i].replace(/^\s*[-*+]\s+/, ""))}</li>`);
          i++;
        }
        html += `<ul>${itemsHtml.join("")}</ul>`;
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)) {
        const firstNumMatch = line.match(/^\s*(\d+)\.\s+/);
        const startNum = firstNumMatch ? Number(firstNumMatch[1]) : 1;
        const itemsHtml = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          itemsHtml.push(`<li>${renderInline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
          i++;
        }
        const startAttr = startNum > 1 ? ` start="${startNum}"` : "";
        html += `<ol${startAttr}>${itemsHtml.join("")}</ol>`;
        continue;
      }

      const pLines = [];
      while (
        i < lines.length &&
        lines[i].trim() &&
        !/^```/.test(lines[i]) &&
        !/^#{1,4}\s+/.test(lines[i]) &&
        !/^>\s?/.test(lines[i]) &&
        !/^\s*[-*+]\s+/.test(lines[i]) &&
        !/^\s*\d+\.\s+/.test(lines[i]) &&
        !/^(\*{3,}|-{3,}|_{3,})\s*$/.test(lines[i])
      ) {
        pLines.push(lines[i]);
        i++;
      }
      html += `<p>${pLines.map(renderInline).join("<br />")}</p>`;
    }
    return html;
  }

  threadEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".code-copy-btn");
    if (!btn) return;
    const code = btn.closest(".code-block")?.querySelector("pre code")?.textContent || "";
    navigator.clipboard.writeText(code).then(() => {
      const prev = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = prev; }, 1400);
    });
  });

  // ===== Human-friendly tool labels =====
  function shortPath(p) {
    if (!p) return "";
    const parts = String(p).split("/").filter(Boolean);
    return parts.length > 2 ? `…/${parts.slice(-2).join("/")}` : String(p);
  }

  function formatToolLabel(name, args, status) {
    const a = args || {};
    const done = status !== "running";
    switch (name) {
      case "read": return `${done ? "Read" : "Reading"} ${shortPath(a.path) || "file"}`;
      case "edit": return `${done ? "Edited" : "Editing"} ${shortPath(a.path) || "file"}`;
      case "write": return `${done ? "Wrote" : "Writing"} ${shortPath(a.path) || "file"}`;
      case "bash": {
        const cmd = String(a.command || "").trim().split("\n")[0];
        const preview = cmd.length > 55 ? cmd.slice(0, 55) + "…" : cmd;
        return `${done ? "Ran" : "Running"}: ${preview || "command"}`;
      }
      case "codemode": return done ? "Ran tool script" : "Running tool script…";
      case "grep": return `${done ? "Searched" : "Searching"} for “${a.pattern || ""}”`;
      case "find": return `${done ? "Found files" : "Finding files"} ${a.pattern || ""}`.trim();
      case "ls": return `${done ? "Listed" : "Listing"} ${shortPath(a.path) || "directory"}`;
      default: return `${done ? "Used" : "Running"} ${name}`;
    }
  }

  function extractResultText(result) {
    if (!result) return "";
    if (typeof result === "string") return result;
    if (Array.isArray(result.content)) {
      return result.content.map((c) => (c.type === "text" ? c.text : `[${c.type}]`)).join("\n");
    }
    return JSON.stringify(result, null, 2);
  }

  // ===== Sidebar Rendering =====
  function findActiveMeta(cwd) {
    for (const repo of workspaces) {
      for (const wt of repo.worktrees) {
        if (wt.path === cwd) return { repo, wt };
      }
    }
    return null;
  }

  function renderSidebar() {
    sidebarList.innerHTML = "";

    // Quick Session (home directory)
    if (homeDir) {
      const homeSess = sessionStates.get(homeDir);
      const quickDiv = document.createElement("div");
      quickDiv.className = `wt-item ${activeCwd === homeDir ? "active" : ""}`;
      const dotClass = homeSess?.isStreaming ? "busy" : homeSess?.running ? "running" : "";
      quickDiv.innerHTML = `
        <span class="wt-dot ${dotClass}"></span>
        <span class="wt-label">Scratchpad</span>
        <span class="wt-tag">~</span>
      `;
      quickDiv.onclick = () => selectWorkspace(homeDir);
      sidebarList.appendChild(quickDiv);
    }

    const label = document.createElement("div");
    label.className = "sidebar-section-label";
    label.textContent = "Workspaces";
    sidebarList.appendChild(label);

    if (workspaces.length === 0) {
      const empty = document.createElement("div");
      empty.className = "sidebar-empty";
      empty.textContent = "No repositories added. Click “Open repository” to attach a local project or git repo.";
      sidebarList.appendChild(empty);
      return;
    }

    for (const repo of workspaces) {
      const group = document.createElement("div");
      group.className = "repo-group";

      const hdr = document.createElement("div");
      hdr.className = "repo-header";
      hdr.title = repo.path;
      hdr.innerHTML = `
        <span class="repo-name">${escapeHtml(repo.name)}</span>
        <span class="repo-btns">
          ${repo.isGit ? '<button class="tiny-btn add-wt" title="New git worktree">+</button>' : ""}
          <button class="tiny-btn danger rm-repo" title="Remove from sidebar">×</button>
        </span>
      `;

      const addWtBtn = hdr.querySelector(".add-wt");
      if (addWtBtn) {
        addWtBtn.onclick = (e) => {
          e.stopPropagation();
          showCreateWorktreeModal(repo);
        };
      }

      hdr.querySelector(".rm-repo").onclick = async (e) => {
        e.stopPropagation();
        const res = await fetch("/api/workspaces/remove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: repo.path }),
        }).then((r) => r.json());
        if (res.success) {
          workspaces = res.workspaces;
          renderSidebar();
        }
      };

      group.appendChild(hdr);

      for (const wt of repo.worktrees) {
        const localSt = sessionStates.get(wt.path);
        const isStreaming = localSt ? localSt.isStreaming : wt.isStreaming;
        const running = localSt ? localSt.running : wt.running;
        const dotClass = isStreaming ? "busy" : running ? "running" : "";

        const item = document.createElement("div");
        item.className = `wt-item ${activeCwd === wt.path ? "active" : ""}`;
        item.title = wt.path;
        item.innerHTML = `
          <span class="wt-dot ${dotClass}"></span>
          <span class="wt-label">${escapeHtml(wt.branch || repo.name)}</span>
          ${wt.isMain && repo.isGit ? '<span class="wt-tag">main</span>' : ""}
          ${!wt.isMain ? '<button class="tiny-btn danger wt-remove" title="Delete worktree">×</button>' : ""}
        `;

        item.onclick = () => selectWorkspace(wt.path);

        const rmWtBtn = item.querySelector(".wt-remove");
        if (rmWtBtn) {
          rmWtBtn.onclick = (e) => {
            e.stopPropagation();
            showRemoveWorktreeModal(repo, wt);
          };
        }

        group.appendChild(item);
      }

      sidebarList.appendChild(group);
    }
  }

  // ===== Workspace & Worktree Modals =====
  function showAddPathModal() {
    openModal(`
      <h3>Add project folder</h3>
      <label>
        Folder path
        <input class="modal-input" id="pathInput" placeholder="~/projects/my-app" />
      </label>
      <div class="modal-actions">
        <button class="btn-secondary" id="mCancel">Cancel</button>
        <button class="btn-primary" id="mAdd">Add folder</button>
      </div>
    `);
    const inp = modalBox.querySelector("#pathInput");
    inp.focus();
    const submit = async () => {
      const p = inp.value.trim();
      if (!p) return;
      const res = await fetch("/api/workspaces/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: p }),
      }).then((r) => r.json());
      if (!res.success) {
        showToast(res.error || "Could not add folder", "error");
        return;
      }
      workspaces = res.workspaces;
      closeModal();
      await selectWorkspace(res.selectedPath || res.repo.path);
    };
    modalBox.querySelector("#mCancel").onclick = closeModal;
    modalBox.querySelector("#mAdd").onclick = submit;
    inp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  }

  function showCreateWorktreeModal(repo) {
    openModal(`
      <h3>New worktree in ${escapeHtml(repo.name)}</h3>
      <p>Creates a separate branch & folder so Pi can work on this task in parallel without touching your other worktrees.</p>
      <label>
        Branch name
        <input class="modal-input" id="wtBranch" placeholder="feat/new-feature" />
      </label>
      <label>
        Base branch (optional — defaults to current HEAD)
        <input class="modal-input" id="wtBase" placeholder="main" />
      </label>
      <div class="modal-actions">
        <button class="btn-secondary" id="mCancel">Cancel</button>
        <button class="btn-primary" id="mCreate">Create worktree</button>
      </div>
    `);
    const branchInp = modalBox.querySelector("#wtBranch");
    const baseInp = modalBox.querySelector("#wtBase");
    const createBtn = modalBox.querySelector("#mCreate");
    branchInp.focus();

    const submit = async () => {
      const branch = branchInp.value.trim();
      if (!branch) return;
      createBtn.disabled = true;
      createBtn.textContent = "Creating…";
      const res = await fetch("/api/worktrees/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repoPath: repo.path, branch, baseBranch: baseInp.value.trim() }),
      }).then((r) => r.json());
      if (!res.success) {
        createBtn.disabled = false;
        createBtn.textContent = "Create worktree";
        showToast(res.error || "Failed to create worktree", "error");
        return;
      }
      workspaces = res.workspaces;
      closeModal();
      showToast(`Created worktree “${branch}”`, "info");
      await selectWorkspace(res.worktreePath);
    };
    modalBox.querySelector("#mCancel").onclick = closeModal;
    createBtn.onclick = submit;
    branchInp.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  }

  function showRemoveWorktreeModal(repo, wt) {
    openModal(`
      <h3>Remove worktree “${escapeHtml(wt.branch)}”?</h3>
      <p>This stops the Pi session in this worktree and removes ${escapeHtml(wt.path)} from disk.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="mCancel">Cancel</button>
        <button class="btn-primary" id="mRemove" style="background:var(--danger);">Remove</button>
      </div>
    `);
    modalBox.querySelector("#mCancel").onclick = closeModal;
    modalBox.querySelector("#mRemove").onclick = async () => {
      const res = await fetch("/api/worktrees/remove", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repoPath: repo.path, worktreePath: wt.path, force: true }),
      }).then((r) => r.json());
      if (!res.success) {
        showToast(res.error || "Failed to remove worktree", "error");
        return;
      }
      sessionStates.delete(wt.path);
      workspaces = res.workspaces;
      closeModal();
      if (activeCwd === wt.path) {
        await selectWorkspace(repo.path);
      } else {
        renderSidebar();
      }
    };
  }

  // ===== Topbar & Controls =====
  function renderModelDropdown(st) {
    modelSelect.innerHTML = "";
    const byProvider = new Map();
    for (const m of st.models || []) {
      const p = m.provider || "Other";
      if (!byProvider.has(p)) byProvider.set(p, []);
      byProvider.get(p).push(m);
    }
    for (const [provider, list] of byProvider) {
      const grp = document.createElement("optgroup");
      grp.label = provider;
      for (const m of list) {
        const opt = document.createElement("option");
        opt.value = `${m.provider}::${m.id}`;
        opt.textContent = m.name || m.id;
        grp.appendChild(opt);
      }
      modelSelect.appendChild(grp);
    }
    if (st.currentModel) {
      modelSelect.value = `${st.currentModel.provider}::${st.currentModel.id}`;
    }

    if (st.thinkingLevels && st.thinkingLevels.length > 1) {
      thinkingSelect.style.display = "";
      thinkingSelect.innerHTML = st.thinkingLevels
        .map((l) => `<option value="${escapeHtml(l)}">Thinking: ${escapeHtml(l)}</option>`)
        .join("");
      if (st.thinkingLevel) thinkingSelect.value = st.thinkingLevel;
    } else {
      thinkingSelect.style.display = "none";
    }
  }

  function updateControls() {
    if (!activeCwd) return;
    const st = getSessionState(activeCwd);
    const meta = findActiveMeta(activeCwd);

    if (meta) {
      activeTitle.textContent = meta.repo.name;
      activeBranch.textContent = meta.wt.branch ? `· ${meta.wt.branch}` : "";
      activeCrumb.title = activeCwd;
      document.title = `Pi — ${meta.repo.name}${meta.wt.branch ? ` (${meta.wt.branch})` : ""}`;
    } else {
      activeTitle.textContent = activeCwd === homeDir ? "Quick chat" : shortPath(activeCwd);
      activeBranch.textContent = activeCwd === homeDir ? "· ~" : "";
      activeCrumb.title = activeCwd;
      document.title = "Pi";
    }

    activeDot.className = "wt-dot " + (st.isStreaming ? "busy" : st.running ? "running" : "");
    const perchedCat = document.getElementById("perchedCat");
    if (perchedCat) perchedCat.classList.toggle("working", Boolean(st.isStreaming));

    const pawSvg = '<ellipse cx="12" cy="15.5" rx="4.4" ry="3.5" fill="currentColor"></ellipse><circle cx="7.2" cy="10.2" r="1.9" fill="currentColor"></circle><circle cx="10.4" cy="7.8" r="1.9" fill="currentColor"></circle><circle cx="13.8" cy="7.8" r="1.9" fill="currentColor"></circle><circle cx="16.9" cy="10.2" r="1.9" fill="currentColor"></circle>';

    if (st.isStreaming) {

      if (promptInput.value.trim()) {
